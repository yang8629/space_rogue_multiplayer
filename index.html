    return `星區 ${this.sector}：戰鬥 ${Math.round(R.time - S.t0)} 秒、擊殺 ${R.kills - S.kills0}、傷害 ${Math.round(this.totalDmg() - S.dmg0)}、` +
      `離開時 HP ${Math.max(0, Math.ceil(this.player.hp))}/${this.player.maxHp}、晶體 ${this.credits}`;
  },
  nextSector() {
    if (this.runStats) this.runStats.sectors.push(this.sectorSummary());
    this.sector++;
    this.bossId = this.bossFor(this.sector);
    this.sectorStats = { chips: {}, t0: this.runStats.time, kills0: this.runStats.kills, dmg0: this.totalDmg() };
    this.map = genMap(); this.node = null; this.visited = [];
    const p = this.player;
    p.hp = Math.min(p.maxHp, p.hp + Math.round(p.maxHp * 0.3));
    this.showMap(this.sector === CFG.CAMPAIGN_SECTORS + 1
      ? `進入無盡模式：星區 ${this.sector}，船體修復 30%。旗艦改為隨機出現`
      : `進入星區 ${this.sector}：船體修復 30%，敵人更強了`);
  },
  // 結束遠征（通關或中途撤退）：存下遊玩紀錄後回到標題
  finishRun() {
    this.saveRecord(this.sector >= CFG.CAMPAIGN_SECTORS ? 'cleared' : 'retired');
    this.state = 'title'; this.inArena = false;
    Screen.title();
  },

  // ---------- 遊玩紀錄（存在瀏覽器；標題畫面「遊玩紀錄」可以查看、複製） ----------
  loadRecords() {
    try { const r = JSON.parse(localStorage.getItem('runRecords') || '[]'); return Array.isArray(r) ? r : []; } catch (e) { return []; }
  },
  saveRecord(result) {
    const R = this.runStats;
    if (!['run', 'coop'].includes(this.mode) || !R || R.recorded || MechCheck.running) return;  // 機制檢查的模擬局不存
    R.recorded = true;
    const rec = this.mode === 'coop' ? Net.buildRecord(result) : this.buildRecord(result);
    const list = [rec, ...this.loadRecords()].slice(0, CFG.MAX_RECORDS);
    try { localStorage.setItem('runRecords', JSON.stringify(list)); } catch (e) {}
  },
  // 目前這一局的紀錄（結算畫面的「複製這局紀錄」也用它，打完 Boss 還沒結束的局也能複製）
  buildRecord(result) {
    const R = this.runStats;
    const total = Object.values(R.dmg).reduce((a, b) => a + b, 0);
    const chips = Object.entries(R.chips).sort((a, b) => b[1] - a[1]).map(([k, v]) => [dmgKeyName(k), Math.round(v)]);
    const name = id => id ? CHIPS[id].name : null;
    // 打到哪：星區、層、節點種類、波次；王戰時再加上王剩多少血
    const node = this.node, C = this.combat, boss = (this.enemies || []).find(e => e.t.boss && !e.dead);
    let where = node ? `${this.isEndless() ? '無盡 · ' : ''}星區 ${this.sector} 第 ${node.L + 1} 層（${NODE_META[node.type].label}）` : `星區 ${this.sector} 航圖`;
    if (node && C && this.inArena && C.wavesTotal !== Infinity) where += ` 第 ${C.wave} / ${C.wavesTotal} 波`;
    if (boss && this.inArena) where += `，${boss.t.name}剩 ${Math.max(0, Math.round(boss.hp / boss.maxHp * 100))}% 血${boss.enraged ? '（暴走中）' : ''}`;
    const s = this.stats, P = this.passives;
    const inFight = this.inArena && this.nodeLog;
    const rec = {
      v: 2, build: CFG.VERSION, at: new Date().toISOString(), result, where,
      input: Input.touch ? `觸控（自動攻擊${Input.autoFire ? '開' : '關'}）` : '滑鼠鍵盤',
      ship: SHIPS[this.shipId].name, weapon: weaponTitle(this.weapon),
      sector: this.sector, layer: this.node ? this.node.L + 1 : 0, endless: this.isEndless(),
      bosses: R.bosses.slice(), cause: result === 'dead' ? this.lastHit : '',
      time: Math.round(R.time), kills: R.kills, dmg: Math.round(total), maxHit: Math.round(R.maxHit),
      dps: R.time > 0 ? Math.round(total / R.time) : 0,
      dmgBySource: Object.fromEntries(DMG_SOURCES.filter(([k]) => R.dmg[k] > 0).map(([k, label]) => [label, Math.round(R.dmg[k])])),
      chipDmg: chips, chain: this.chain.map(name), inv: this.inventory.filter(Boolean).map(name),
      // 最後的電路數值：插槽數、能量、射速、每發子彈數與傷害、編輯器的估算 DPS、倉庫被動
      stats: { slots: this.chain.length, heat: s.heat, rateCut: `-${Math.round((1 - heatRateMul(s.heat)) * 100)}%`, rps: +s.rps.toFixed(2),
        perFire: s.count, fireDmg: Math.round(s.dmg), estDps: Math.round(s.dpsEst), triggerLayers: s.layers.length, knock: this.wp.knock,
        passives: Object.entries(P).filter(([, v]) => v > 0).map(([k, v]) => PASSIVE_LABEL[k](+v.toFixed(2))) },
      credits: this.credits, hp: Math.max(0, Math.ceil(this.player.hp)), maxHp: this.player.maxHp,
      // 生存：受到的傷害依來源、被打中次數、衝刺次數
      taken: Object.fromEntries(Object.entries(R.taken).sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, Math.round(v)])),
      hits: R.hits, dashes: R.dashes,
      // 過程：各關摘要、走過的節點（戰鬥節點含秒數與掉血）、武器升級、取得的晶片與插槽
      sectors: [...R.sectors, this.sectorSummary() + (result === 'cleared' || result === 'retired' ? '' : ' ←目前')],
      path: [...R.path, ...(inFight ? [this.nodeSummary(true)] : [])],
      upgrades: R.upgrades.slice(), got: R.got.slice(),
    };
    return rec;
  },
  findScrap() {
    for (const arr of [this.chain, this.inventory]) {
      const i = arr.indexOf('scrap');
      if (i >= 0) return { arr, i };
    }
    return null;
  },
  removeScrap() {
    const s = this.findScrap(), price = CFG.SCRAP_REMOVE;
    if (!s || this.credits < price) return;
    this.credits -= price;
    s.arr[s.i] = null;
    this.recalc();
    Screen.shop();
  },

  // ---------- 黑洞 ----------
  ownedFusable() {  // 電路與倉庫中可以投入黑洞的晶片
    const out = [];
    this.chain.forEach((id, i) => { if (canFuse(id)) out.push({ key: 'chain:' + i, arr: this.chain, i, id }); });
    this.inventory.forEach((id, i) => { if (canFuse(id)) out.push({ key: 'inv:' + i, arr: this.inventory, i, id }); });
    return out;
  },
  openBlackhole() {
    this.bh = { sel: [], result: null };
    this.state = 'blackhole';
    Screen.blackhole();
  },
  bhToggle(key) {
    const S = this.bh.sel, k = S.indexOf(key);
    if (k >= 0) S.splice(k, 1);
    else if (S.length < 2) S.push(key);
    Screen.blackhole();
  },
  bhFuse() {
    const owned = this.ownedFusable(), [a, b] = this.bh.sel.map(k => owned.find(o => o.key === k));
    if (!a || !b) return;
    const ok = Math.random() < CFG.FUSE_SUCCESS;
    const result = ok ? fuseChips(a.id, b.id) : 'scrap';
    if (this.runStats) this.runStats.got.push(`${this.here()} 黑洞融合 ${CHIPS[a.id].name}＋${CHIPS[b.id].name} → ${ok ? CHIPS[result].name : '廢鐵'}`);
    a.arr[a.i] = result;   // 結果留在第一個素材的位置
    b.arr[b.i] = null;
    this.recalc();
    this.bh = { sel: [], result: { ok, id: result, where: a.arr === this.chain ? '電路' : '倉庫' }, fusing: true };
    Screen.blackhole();
    SFX.play('fusing');
    setTimeout(() => {
      if (this.state !== 'blackhole') return;
      this.bh.fusing = false;
      SFX.play(ok ? 'fuseok' : 'fusefail');
      Screen.blackhole();
    }, 1200);
  },

  // ---------- 共用 ----------
  recalc() {
    this.stats = analyzeChain(this.chain);
    this.passives = computePassives(this.inventory);
    const p = this.player;
    if (p) {
      const newMax = p.ship.hp + this.passives.maxHp;
      if (newMax > p.maxHp) p.hp += newMax - p.maxHp;
      p.maxHp = newMax;
      p.hp = Math.min(p.hp, p.maxHp);
    }
  },
  toggleEditor() {
    if (Net.active()) return;  // 雙人測試版第 1 步：還不能編輯電路（第 2 步加上「全員暫停」）
    if (this.state === 'editor') {
      this.state = this.returnState;
      Editor.close();
      this.recalc();
      if (this.state === 'map') Screen.map();
      else if (this.state === 'reward') Screen.reward();
      else if (this.state === 'shop') Screen.shop();
      else if (this.state === 'blackhole') { this.bh.sel = []; Screen.blackhole(); }
      else if (this.state === 'armory') Screen.armory(this.armorySource || 'armory');
    } else if (['play', 'map', 'reward', 'shop', 'blackhole', 'armory'].includes(this.state)) {
      this.returnState = this.state;
      this.state = 'editor';
      Input.down = false; Input.dash = false; Input.joy = null; Input.aimStick = null;
      Editor.open();
    }
  },
  shake(v) { this.cam.shake = Math.max(this.cam.shake, v); },
  recordDamage(source, amount, att) {  // 本局傷害統計：依來源分類，並依晶片分攤（見 splitDamage）
    const R = this.runStats;
    if (!R || !(amount > 0)) return;
    R.dmg[source] = (R.dmg[source] || 0) + amount;
    if (source !== 'burn') R.maxHit = Math.max(R.maxHit, amount);
    const parts = splitDamage(amount, att, source === 'shock' ? null : this.stats && this.stats.rateCr);
    const sec = this.sectorStats && this.sectorStats.chips;
    for (const k in parts) {
      R.chips[k] = (R.chips[k] || 0) + parts[k];
      if (sec) sec[k] = (sec[k] || 0) + parts[k];
    }
  },
  restoreScreen() {  // 依目前狀態重畫對應的畫面（機制檢查跑完後用）
    const st = this.state === 'editor' ? this.returnState : this.state;
    switch (st) {
      case 'title': Screen.title(); break;
      case 'map': Screen.map(); break;
      case 'reward': Screen.reward(); break;
      case 'shop': Screen.shop(); break;
      case 'blackhole': Screen.blackhole(); break;
      case 'armory': Screen.armory(this.armorySource || 'armory'); break;
      case 'victory': Screen.victory(); break;
      case 'dead': Screen.dead(); break;
      default: Screen.hide();
    }
  },

  onEnemyKilled(e) {
    this.kills++;
    if (this.runStats) this.runStats.kills++;
    const big = e.type === 'brute' || e.type === 'elite';
    burst(e.x, e.y, e.t.color, big ? 40 : 16, big ? 320 : 220, 0.6, 2.5);
    SFX.play(e.t.boss ? 'bossdeath' : big ? 'bigkill' : 'kill');
    if (big) this.shake(e.type === 'elite' ? 14 : 6);
    if (e.t.boss) {  // 母艦爆炸：清除所有小怪與敵彈
      this.shake(28);
      burst(e.x, e.y, e.t.color, 150, 600, 1.4, 3.5);
      burst(e.x, e.y, '#ffd166', 80, 400, 1.2, 3);
      for (const o of this.enemies) if (o !== e && !o.dead) { o.dead = true; burst(o.x, o.y, o.t.color, 10, 200, 0.5, 2); }
      this.eBullets = [];
      this.banner = { text: '旗艦擊沉！', t: 2 };
    }
    let n = e.t.credits;
    for (let i = 0; i < e.t.credits; i++) if (Math.random() < this.passives.greed) n++;
    for (let i = 0; i < n; i++)
      this.pickups.push({ id: this.nextId++, x: e.x + rand(-8, 8), y: e.y + rand(-8, 8), vx: rand(-80, 80), vy: rand(-80, 80), life: 14 });
    if (e.type === 'elite' && this.combat.sandbox) {
      const i = this.inventory.indexOf(null), id = pick(COMPOSITE_IDS);
      if (i >= 0) { this.inventory[i] = id; this.recalc(); floatText(e.x, e.y - 30, `獲得 ${CHIPS[id].name}`, '#ff9f1c', true); }
    }
  },
  hurtPlayer(dmg, cause = '', p = this.player) {
    if (p.dead || p.invuln || this.state !== 'play') return;
    dmg *= 1 - Math.min(0.6, this.passivesOf(p).armor + p.ship.armor);
    p.hp -= dmg; p.iframe = CFG.IFRAME;
    burst(p.x, p.y, '#ff4d6d', 16, 240, 0.4, 2);
    if (p !== this.player) {  // 房主這邊：隊友被打中（隊友的畫面震動、音效由隊友自己的電腦處理）
      p.lastHit = cause;
      if (p.hp <= 0) this.playerDown(p);
      return;
    }
    this.lastHit = cause;
    const R = this.runStats;
    if (R) { const k = cause || '其他'; R.taken[k] = (R.taken[k] || 0) + dmg; R.hits++; }
    this.shake(9);
    SFX.play(p.hp <= 0 ? 'death' : 'hurt');
    if (p.hp <= 0 && this.mode === 'coop') { this.playerDown(p); return; }
    if (p.hp <= 0) {
      p.hp = 0; this.state = 'dead'; Input.down = false;
      this.saveRecord('dead');
      burst(p.x, p.y, '#4cc9f0', 80, 400, 1.2, 3);
      this.shake(20);
      setTimeout(() => { if (this.state === 'dead') Screen.dead(); }, 900);
    }
  },

  // 雙人：一方被擊墜 → 等隊友；兩人都被擊墜 → 結束（房主判定）
  playerDown(p) {
    p.hp = 0; p.dead = true;
    burst(p.x, p.y, p.ship.color, 80, 400, 1.2, 3);
    if (this.players().length) {
      this.banner = { text: `${p === this.player ? '1P' : '2P'} 被擊墜！`, sub: '剩下的隊友撐住', t: 2.5 };
      return;
    }
    this.state = 'dead'; Input.down = false;
    // 結束訊息帶上隊友的最終血量與擊毀原因（最後一次同步可能還沒送到）
    Net.send({ t: 'over', wave: this.combat.wave, cause: this.mate ? this.mate.lastHit || '' : '' });
    this.saveRecord('dead');
    setTimeout(() => { if (this.state === 'dead') Screen.dead(); }, 900);
  },

  // ---------- 主更新 ----------
  update(dt) {
    if (Net.role === 'client' && this.mode === 'coop') { Net.clientUpdate(dt); return; }
    if (this.state === 'play' && this.mate) Net.hostUpdateMate(dt);
    if (this.state === 'play') {
      this.time += dt;
      if (this.runStats) this.runStats.time += dt;  // 只算實際戰鬥的時間
      if (!this.player.dead) this.player.update(dt);
      this.updateWaves(dt);
      this.updateEnemies(dt);
      this.updateBullets(dt);
      this.updateEnemyBullets(dt);
      this.updatePickups(dt);
    }
    if (this.state === 'play' || this.state === 'dead') this.updateFx(dt);
    if (this.inArena && this.state !== 'editor') this.updateCamera(dt);
    if (!this.inArena) { this.cam.x += dt * 20; this.cam.y += dt * 8; }
    if (Net.role === 'host' && this.mode === 'coop') Net.hostSend(dt);
  },
  updateEnemies(dt) {
    const E = this.enemies;
    for (const e of E) {
      e.update(dt, this.nearestPlayer(e.x, e.y));  // 雙人：追最近的玩家
      if (e.spawnT <= 0) for (const p of this.players()) {
        const rr = e.r + p.r;
        if (dist2(e.x, e.y, p.x, p.y) < rr * rr) this.hurtPlayer(e.t.dmg, e.t.name + '（撞擊）', p);
      }
    }
    for (let i = 0; i < E.length; i++) {  // 簡單分離，避免怪物疊在一起
      const a = E[i];
      for (let j = i + 1; j < E.length; j++) {
        const b = E[j], dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r, d2 = dx * dx + dy * dy;
        if (d2 < rr * rr && d2 > 0.01) {
          const d = Math.sqrt(d2), o = (rr - d) / 2, nx = dx / d, ny = dy / d;
          a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
        }
      }
    }
    this.enemies = E.filter(e => !e.dead);
  },
  updateBullets(dt) {
    const B = this.bullets, E = this.enemies, Q = this.triggerQueue, SQ = [];
    for (const b of B) {
      if (b.dead) continue;
      b.update(dt);
      if (b.dead) continue;
      for (const e of E) {
        if (e.dead || b.hitSet.has(e.id)) continue;
        const rr = b.r + e.r;
        if (segDist2(b.px, b.py, b.x, b.y, e.x, e.y) >= rr * rr) continue;
        b.hitSet.add(e.id);
        const kb = Math.min(220, b.damage * 5) * (14 / e.r) * b.knock;
        e.hurt(b.damage, Math.cos(b.angle) * kb, Math.sin(b.angle) * kb, b.shard ? 'shard' : b.depth > 0 ? 'echo' : 'direct', b.att, b.knock);
        floatText(e.x, e.y - e.r, Math.round(b.damage), b.depth > 0 ? '#ff9dbd' : '#ffffff', b.damage >= 40);
        burst(b.x, b.y, b.color, 4, 160, 0.25, 2);
        SFX.play('hit');
        // 武器升級帶來的命中效果
        if (b.burn) { e.burnDps = Math.max(e.burnT > 0 ? e.burnDps : 0, b.burn.dps); e.burnT = Math.max(e.burnT, b.burn.t); e.burnAtt = b.att; }
        if (b.slow) { e.slowAmt = Math.max(e.slowT > 0 ? e.slowAmt : 0, b.slow); e.slowT = 1.5; }
        if (b.lifesteal) this.healPlayer(b.lifesteal, b.owner ? this.mate : this.player);
        if (b.explode) this.explode(b.x, b.y, b.explode.r, b.damage * b.explode.ratio, b.color, e.id, b.att);
        if (b.shards && SQ.length < 60) SQ.push({ x: b.x, y: b.y, angle: b.angle, b, ignore: e.id });
        if (b.arcs) this.arc(e, b);
        if (b.payload && Q.length < CFG.MAX_TRIGGERS_PER_FRAME)
          Q.push({ payload: b.payload, x: b.x, y: b.y, angle: b.angle, depth: b.depth + 1, ignore: e.id, owner: b.owner });
        // 彈射優先於穿透：還有彈射次數就轉向附近下一隻敵人；沒有目標或次數用完才看穿透
        const next = b.bounce > 0 && nearestEnemy(b.x, b.y, CFG.RICOCHET_RANGE, b.hitSet);
        if (next) {
          b.bounce--;
          b.angle = Math.atan2(next.y - b.y, next.x - b.x);
          const need = Math.hypot(next.x - b.x, next.y - b.y) / b.speed + 0.15;
          b.life = Math.max(b.life, need);  // 確保飛得到下一個目標
          burst(b.x, b.y, '#9dff6b', 5, 180, 0.2, 2);
          SFX.play('ricochet');
        } else if (b.pierce > 0) b.pierce--;
        else b.dead = true;
        break;
      }
    }
    for (const t of Q) {  // 命中觸發：從命中點展開子管線（用射出這顆子彈的人的武器與電路）
      this.withLoadout(t.owner, () => spawnShots(runOps(t.payload, t.depth), t.x, t.y, t.angle, t.depth, t.ignore));
      burst(t.x, t.y, '#ff6b9d', 6, 140, 0.3, 2);
    }
    Q.length = 0;
    for (const s of SQ) {  // 碎片：從命中點往前方扇形散開
      const { n, ratio, homing = 0 } = s.b.shards, list = [];
      for (let k = 0; k < n; k++)
        list.push(shot({ angle: (k - (n - 1) / 2) * (1.6 / n), speed: 620, damage: s.b.damage * ratio, radius: 3,
          life: 0.4, color: s.b.color, homing, shard: true, src: s.b.att.src, cr: s.b.att.cr }));
      this.withLoadout(s.b.owner, () => spawnShots(list, s.x, s.y, s.angle, s.b.depth, s.ignore));
    }
    this.bullets = B.filter(b => !b.dead);
  },
  // 電弧（軌道砲・磁暴線圈）：命中時瞬間打中附近其他敵人；附近敵人不夠時，剩下的電弧打回目標本身（傷害減半）
  arc(hit, b) {
    const { n, ratio } = b.arcs, R = CFG.ARC_RANGE, dmg = b.damage * ratio;
    const near = this.enemies.filter(o => !o.dead && o !== hit && o.spawnT <= 0 && dist2(o.x, o.y, hit.x, hit.y) < (R + o.r) ** 2)
      .sort((p, q) => dist2(p.x, p.y, hit.x, hit.y) - dist2(q.x, q.y, hit.x, hit.y));
    for (let k = 0; k < n; k++) {
      const t = near[k] || hit, d = near[k] ? dmg : dmg * 0.5;
      if (t.dead) continue;
      if (b.slow) { t.slowAmt = Math.max(t.slowT > 0 ? t.slowAmt : 0, b.slow); t.slowT = 1.5; }
      t.hurt(d, 0, 0, 'shard', b.att);
      floatText(t.x, t.y - t.r, Math.round(d), '#9fe8ff');
      if (this.zaps.length < 60) this.zaps.push({ x1: hit.x, y1: hit.y, x2: t.x + rand(-6, 6), y2: t.y + rand(-6, 6), life: 0.18, max: 0.18 });
      if (Net.role === 'host') Net.fx(['z', Math.round(hit.x), Math.round(hit.y), Math.round(t.x), Math.round(t.y)]);
    }
  },
  explode(x, y, r, dmg, color, skipId, att = null) {
    for (const e of this.enemies) {
      if (e.dead || e.id === skipId) continue;
      const d = Math.hypot(e.x - x, e.y - y);
      if (d > r + e.r) continue;
      const k = 120 * (14 / e.r) / (d || 1);
      e.hurt(dmg, (e.x - x) * k, (e.y - y) * k, 'explode', att);
      floatText(e.x, e.y - e.r, Math.round(dmg), '#ffd166');
    }
    if (this.rings.length < 40) this.rings.push({ x, y, r, life: 0.3, max: 0.3, color });
    if (Net.role === 'host') Net.fx(['r', Math.round(x), Math.round(y), Math.round(r), color]);
    SFX.play('explode');
  },
  healPlayer(v, p = this.player) {  // 吸血：每秒最多回復 4 HP（每位玩家各自計算）
    if (!p || p.dead) return;
    if (this.time - (p.healWin || 0) > 1) { p.healWin = this.time; p.healed = 0; }
    const add = Math.min(v, 4 - p.healed);
    if (add <= 0) return;
    p.healed += add;
    p.hp = Math.min(p.maxHp, p.hp + add);
  },
  updateEnemyBullets(dt) {
    const ps = this.players();
    for (const b of this.eBullets) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      for (const p of ps) {
        const rr = b.r + p.r;
        if (dist2(b.x, b.y, p.x, p.y) < rr * rr && !p.invuln && !p.dead) { b.life = 0; this.hurtPlayer(b.dmg, (b.from || '敵人') + '（子彈）', p); break; }
      }
    }
    this.eBullets = this.eBullets.filter(b => b.life > 0);
  },
  updatePickups(dt) {
    for (const c of this.pickups) {
      c.life -= dt;
      const p = this.nearestPlayer(c.x, c.y), range = CFG.MAGNET_RANGE * (1 + this.passivesOf(p).magnet);  // 晶體飛向最近的玩家（錢兩人共用）
      const d2 = dist2(c.x, c.y, p.x, p.y);
      stepPickup(c, p, range, d2, dt);
      if (d2 < 20 * 20) { c.life = 0; this.credits++; SFX.play('pickup'); }
    }
    this.pickups = this.pickups.filter(c => c.life > 0);
  },
  updateFx(dt) {
    for (const q of this.particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.94; q.vy *= 0.94; q.life -= dt; }
    this.particles = this.particles.filter(q => q.life > 0);
    for (const r of this.rings) r.life -= dt;
    this.rings = this.rings.filter(r => r.life > 0);
    for (const z of this.zaps) z.life -= dt;
    this.zaps = this.zaps.filter(z => z.life > 0);
    for (const t of this.texts) { t.y -= 40 * dt; t.life -= dt; }
    this.texts = this.texts.filter(t => t.life > 0);
    if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }
  },
  updateCamera(dt) {
    const p = this.player.dead && this.mate && !this.mate.dead ? this.mate : this.player, c = this.cam;  // 自己被擊墜時看隊友
    const tx = clamp(p.x - ZW / 2, -80, CFG.WORLD_W - ZW + 80);
    const ty = clamp(p.y - ZH / 2, -80, CFG.WORLD_H - ZH + 80);
    c.x += (tx - c.x) * Math.min(1, dt * 8);
    c.y += (ty - c.y) * Math.min(1, dt * 8);
    c.shake = Math.max(0, c.shake - dt * 40);
  },
};

// =====================================================================
// NET — 雙人連線（PeerJS / WebRTC 點對點）
//   房主：跑整個戰場（敵人、子彈、傷害判定），每秒約 30 次把戰場狀態傳給隊友
//   隊友：自己飛船的移動、衝刺在自己電腦上算（零延遲），把位置與「有沒有按開火」傳給房主
//   房主替隊友開火時，用 withLoadout 換上隊友的武器與電路
// =====================================================================
const LOADOUT_KEYS = ['chain', 'inventory', 'weapon', 'wp', 'stats', 'passives', 'shipId'];
const NET_PREFIX = 'circuitrogue-mp-';
const NET_CODE_CHARS = 'ABCDEFGHJKLNPQSTUVWXYZ23456789';  // 去掉容易看錯的 I O 0 1，以及快捷鍵 M R
const NET_RATE = 1 / 30;
const num = (v, d = 0) => (typeof v === 'number' && Number.isFinite(v) ? v : d);
const r2 = v => Math.round(v * 100) / 100;

const Net = {
  role: null,          // null = 單人；'host' = 房主；'client' = 加入的隊友
  peer: null, conn: null, ping: null, code: '',
  linked: false,       // 兩邊已經握手成功
  myPick: null, matePick: null,  // 各自選好的 { ship, weapon, chip }
  stats: null,         // 這一局的連線數據（寫進遊玩紀錄）
  fxBuf: [], sendAcc: 0, inAcc: 0, pingT: 0,
  active() { return !!this.role; },
  fx(e) { if (this.conn && this.fxBuf.length < 400) this.fxBuf.push(e); },
  send(msg) { try { if (this.conn && this.conn.open) this.conn.send(msg); } catch (e) {} },
  resetStats() { this.stats = { pings: [], snaps: 0, inputs: 0, lastRecv: 0, maxGap: 0 }; },
  close() {
    const peer = this.peer, conn = this.conn;
    this.peer = this.conn = null; this.role = null; this.ping = null; this.fxBuf = [];
    this.linked = false; this.mateInRoom = false; this.myPick = this.matePick = null; this.code = '';
    try { conn && conn.close(); } catch (e) {}
    try { peer && peer.destroy(); } catch (e) {}
  },
  // 玩家自己離開（回標題）：還在戰鬥中就先存一筆紀錄
  leave() {
    if (Game.mode === 'coop' && Game.inArena && Game.state === 'play') Game.saveRecord('retired');
    this.close();
  },
  // 每一幀呼叫：連上之後每秒量一次延遲
  tick(dt) {
    if (!this.linked) return;
    this.pingT += dt;
    if (this.pingT >= 1) { this.pingT = 0; this.send({ t: 'ping', at: performance.now() }); }
  },
  pingColor(ms) { return ms == null ? '#8fa3d9' : ms < 80 ? '#9dff6b' : ms < 150 ? '#ffd166' : '#ff4d6d'; },

  // ---------- 大廳：開房 / 輸入房號加入 → 兩人到齊後房主按「開始」 ----------
  lobby(msg = '') {
    this.close();
    this.resetStats();
    this.renderLobby(msg);
  },
  // 一局結束後回到同一個房間（連線不斷），房主可以直接再按開始
  backToRoom() {
    if (!this.linked) { this.lobby('<span style="color:#ff4d6d">連線已經中斷，請重新開房或加入</span>'); return; }
    this.myPick = this.matePick = null;
    this.send({ t: 'room' });
    this.renderLobby();
  },
  renderLobby(msg = '') {
    Game.state = 'lobby'; Game.inArena = false; Game.mate = null;
    const ok = typeof Peer !== 'undefined';
    Screen.show(`<div class="scr title-wrap">
      <h1 style="font-size:42px">👥 雙人連線</h1>
      <div class="sub">先進同一個房間，兩人到齊後由房主按「開始」，再各自選飛船、武器與起始晶片。每局結束後會回到這個房間。</div>
      <div id="netBtns">${this.linked ? '' : ok ? `<div class="row"><button class="big" data-act="nethost">開房間</button></div>
        <div class="row"><input id="netCode" maxlength="4" placeholder="房號" autocomplete="off" spellcheck="false"
          style="font-size:22px;width:5.5em;text-align:center;letter-spacing:.3em;text-transform:uppercase;background:#0a1030;color:#fff;border:1px solid #4cc9f0;border-radius:6px;padding:8px">
          <button class="big" data-act="netjoin">加入房間</button></div>`
      : '<div class="sub" style="color:#ff4d6d">連線元件沒有載入（需要網路）。請確認有連上網路後重新整理。</div>'}</div>
      <div class="sub" id="netMsg" style="min-height:3em">${msg}</div>
      <div class="keys">一人按「開房間」拿到 4 碼房號，另一人輸入房號按「加入房間」。<br>
        測試版：無盡波次、不能編輯電路；一人被擊墜時另一人繼續，兩人都被擊墜才結束。</div>
      <div class="row"><button data-act="title">${this.linked ? '離開房間' : '返回標題'}</button></div>
      <div class="ver">版本 ${CFG.VERSION}</div></div>`);
    if (this.linked) this.lobbyStatus();
  },
  setMsg(html) { const el = document.getElementById('netMsg'); if (el) el.innerHTML = html; },
  // 連上之後的大廳狀態（延遲每秒更新）
  lobbyStatus() {
    if (Game.state !== 'lobby') return;
    const btns = document.getElementById('netBtns');
    if (btns && this.linked) btns.innerHTML = '';
    const ping = `<span style="color:${this.pingColor(this.ping)}">連線延遲 ${this.ping == null ? '測量中…' : this.ping + ' ms'}</span>`;
    if (!this.linked) return;
    const mate = this.mateInRoom ? '<b style="color:#9dff6b">隊友在房間裡</b>' : '<span style="color:#ffd166">等隊友回到房間…</span>';
    this.setMsg(this.role === 'host'
      ? `房號 <b style="letter-spacing:.2em;color:#ffd166">${this.code}</b>　·　${mate}　·　${ping}
         <div class="row"><button class="big" data-act="netstart" ${this.mateInRoom ? '' : 'disabled'}>開始（選擇配裝）</button></div>`
      : `房間 <b style="letter-spacing:.2em;color:#ffd166">${this.code}</b>　·　${ping}<br>等待房主按「開始」…`);
  },

  host() {
    this.close();
    this.role = 'host';
    const code = this.code = Array.from({ length: 4 }, () => pick([...NET_CODE_CHARS])).join('');
    this.setMsg('正在建立房間…');
    const peer = this.peer = new Peer(NET_PREFIX + code);
    peer.on('open', () => this.setMsg(`房號 <b style="font-size:34px;letter-spacing:.2em;color:#ffd166">${code}</b><br>把房號告訴隊友，等待加入中…`));
    peer.on('connection', conn => {
      if (this.conn) {  // 已經有隊友了
        conn.on('open', () => { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 500); });
        return;
      }
      this.conn = conn;
      this.bind(conn);
    });
    peer.on('error', e => this.fail(e));
  },
  join(raw) {
    const code = String(raw || '').trim().toUpperCase();
    if (!/^[A-Z0-9]{4}$/.test(code)) { this.setMsg('<span style="color:#ff4d6d">請輸入 4 碼房號</span>'); return; }
    this.close();
    this.role = 'client'; this.code = code;
    this.setMsg('連線中…');
    const peer = this.peer = new Peer();
    peer.on('open', () => {
      const conn = this.conn = peer.connect(NET_PREFIX + code, { reliable: true, serialization: 'json' });
      this.bind(conn);
      conn.on('open', () => { this.setMsg('已連上，確認版本中…'); this.send({ t: 'hello', v: CFG.VERSION }); });
    });
    peer.on('error', e => this.fail(e));
  },
  bind(conn) {
    conn.on('data', m => this.onData(m));
    conn.on('close', () => this.lost());
    conn.on('error', () => this.lost());
  },
  fail(e) {
    const t = e && e.type;
    if (t === 'unavailable-id' && this.role === 'host') { this.host(); return; }  // 房號撞到別人，換一個
    const msg = {
      'peer-unavailable': '找不到這個房號（房主還沒開房，或打錯了）',
      network: '連不上配對伺服器，請檢查網路',
      'server-error': '配對伺服器暫時沒有回應，請稍後再試',
      'browser-incompatible': '這個瀏覽器不支援點對點連線',
    }[t] || `連線錯誤（${t || e}）`;
    this.lost(msg);
  },
  lost(msg = '隊友已離線') {
    if (!this.role) return;
    if (Game.mode === 'coop' && Game.inArena && Game.state === 'play') Game.saveRecord('disconnect');  // 戰鬥中斷線也存一筆
    const inLobby = Game.state === 'lobby';
    this.close();
    if (inLobby) { this.lobby(`<span style="color:#ff4d6d">${msg}</span>`); return; }
    if (Game.state === 'title') return;
    Game.mate = null; Game.state = 'title'; Game.inArena = false;
    Screen.show(`<div class="scr title-wrap"><h1 style="font-size:40px;color:#ff4d6d">連線中斷</h1>
      <div class="sub">${msg}</div>
      <div class="row"><button class="big" data-act="title">回到標題</button><button data-act="records">📜 遊玩紀錄</button></div></div>`);
  },

  onData(m) {
    if (!m || typeof m !== 'object') return;
    const now = performance.now(), S = this.stats;
    if (S && (m.t === 's' || m.t === 'i')) {  // 同步訊息之間最長隔多久（卡頓的指標）
      if (S.lastRecv && Game.state === 'play') S.maxGap = Math.max(S.maxGap, now - S.lastRecv);
      S.lastRecv = now;
      if (m.t === 's') S.snaps++; else S.inputs++;
    }
    switch (m.t) {
      case 'hello':
        if (this.role !== 'host' || this.linked) break;
        if (m.v !== CFG.VERSION) {  // 版號不同（有人沒重新整理）：不讓開始
          const theirs = String(m.v || '舊版').slice(0, 40);
          this.send({ t: 'ver', v: CFG.VERSION });
          this.setMsg(`<span style="color:#ff4d6d">隊友的版本不同（你：${CFG.VERSION}／隊友：${theirs}），請兩邊都按 Ctrl+F5 重新整理</span>`);
          break;
        }
        this.linked = true; this.mateInRoom = true;
        this.send({ t: 'welcome', v: CFG.VERSION, code: this.code });
        this.lobbyStatus();
        break;
      case 'welcome': if (this.role === 'client') { this.linked = true; this.lobbyStatus(); } break;
      case 'ver': this.lost(`你和房主的版本不同（你：${CFG.VERSION}／房主：${String(m.v || '舊版').slice(0, 40)}），請兩邊都按 Ctrl+F5 重新整理`); break;
      case 'room': this.mateInRoom = true; this.lobbyStatus(); break;
      case 'full': this.lost('這個房間已經有兩個人了'); break;
      case 'pick': if (this.role === 'client' && Game.state === 'lobby') this.enterPick(); break;
      case 'ready': this.onMateReady(m); break;
      case 'start': if (this.role === 'client') this.startClient(m); break;
      case 'i': if (this.role === 'host') this.applyInput(m); break;
      case 's': if (this.role === 'client') this.applySnap(m); break;
      case 'over':
        if (this.role === 'client' && Game.combat && Game.state === 'play') {
          Game.state = 'dead'; Game.combat.wave = num(m.wave, Game.combat.wave); Input.down = false;
          const P = Game.player;
          if (!P.dead) { P.hp = 0; P.dead = true; burst(P.x, P.y, P.ship.color, 80, 400, 1.2, 3); }
          Game.lastHit = typeof m.cause === 'string' ? m.cause.slice(0, 60) : '';
          Game.saveRecord('dead');
          setTimeout(() => { if (Game.state === 'dead') Screen.dead(); }, 900);
        }
        break;
      case 'ping': this.send({ t: 'pong', at: m.at }); break;
      case 'pong': {
        const ms = Math.round(now - num(m.at, now));
        if (ms < 0 || ms > 60000) break;
        this.ping = ms;
        if (S && Game.state === 'play' && S.pings.length < 3600) S.pings.push(ms);
        this.lobbyStatus();
        break;
      }
    }
  },

  // ---------- 選配裝：房主按開始 → 兩人各自選飛船、武器、起始晶片 → 都選好就開戰 ----------
  beginPick() {
    if (this.role !== 'host' || !this.linked || !this.mateInRoom) return;  // 隊友回到房間才能開始
    this.send({ t: 'pick' });
    this.enterPick();
  },
  enterPick() {
    this.myPick = this.matePick = null; this.mateInRoom = false;
    Game.state = 'pick'; Game.inArena = false;
    Screen.select('coop');
  },
  cleanPick(m) {  // 對方傳來的選擇：不認得的就換成預設值
    return { ship: SHIPS[m.ship] ? m.ship : 'vanguard', weapon: WEAPONS[m.weapon] ? m.weapon : 'laser',
      chip: NORMAL_IDS.includes(m.chip) ? m.chip : null };
  },
  ready(ship, weapon, chip) {
    if (!this.linked) { this.lost(); return; }
    this.myPick = this.cleanPick({ ship, weapon, chip });
    this.send({ t: 'ready', ...this.myPick });
    if (this.role === 'host' && this.matePick) this.startHost();
    else this.waitScreen();
  },
  onMateReady(m) {
    if (!['pick', 'wait'].includes(Game.state)) return;
    this.matePick = this.cleanPick(m);
    if (this.role === 'host' && this.myPick) this.startHost();
    else if (Game.state === 'wait') this.waitScreen();
  },
  waitScreen() {
    Game.state = 'wait';
    const P = this.myPick, M = this.matePick, line = p => p
      ? `<b style="color:${SHIPS[p.ship].color}">${SHIPS[p.ship].name}</b> ＋ ${WEAPONS[p.weapon].name} ＋ ${p.chip ? CHIPS[p.chip].name : '無起始晶片'}`
      : '<span style="color:#8fa3d9">選擇中…</span>';
    Screen.show(`<div class="scr title-wrap"><h1 style="font-size:36px">等待隊友</h1>
      <div class="sub">你：${line(P)}<br>隊友：${line(M)}<br><br>${this.role === 'host' ? '兩人都選好就會開始。' : '兩人都選好後，房主那邊會開始戰鬥。'}</div>
      <div class="row"><button data-act="title">離開房間</button></div></div>`);
  },

  // ---------- 開始 ----------
  makeLoadout(p) {  // 隊友的配裝（房主這邊用來算隊友的子彈）
    const L = { shipId: p.ship, weapon: { id: p.weapon, path: null, final: null },
      chain: startChain(p.chip), inventory: Array(CFG.INV_SLOTS).fill(null) };
    L.wp = weaponParams(L.weapon);
    Game.withLoadout(L, () => { Game.stats = analyzeChain(Game.chain); Game.passives = computePassives(Game.inventory); });
    return L;
  },
  startHost() {
    const me = this.myPick, mp = this.matePick;
    this.resetStats();
    Game.newRun('coop', me.ship, me.weapon, me.chip);
    const mate = Game.mate = new Player(SHIPS[mp.ship]);
    mate.L = this.makeLoadout(mp);
    mate.hp = mate.maxHp = SHIPS[mp.ship].hp + mate.L.passives.maxHp;
    mate.dashSeq = 0; mate.wantFire = false;
    Game.startCombat({ sandbox: true, level: 0 });
    this.send({ t: 'start', ...me });
  },
  startClient(m) {
    if (!this.myPick) return;
    this.matePick = this.cleanPick(m);
    this.resetStats();
    const me = this.myPick;
    Game.newRun('coop', me.ship, me.weapon, me.chip);
    Game.mate = new Player(SHIPS[this.matePick.ship]);
    Game.startCombat({ sandbox: true, level: 0 });
  },

  // ---------- 遊玩紀錄（雙人） ----------
  buildRecord(result) {
    const G = Game, R = G.runStats, S = this.stats || { pings: [], snaps: 0, inputs: 0, maxGap: 0 };
    const total = R ? Object.values(R.dmg).reduce((a, b) => a + b, 0) : 0;
    const name = id => (id && CHIPS[id] ? CHIPS[id].name : null);
    const mp = this.matePick, ps = [...S.pings].sort((a, b) => a - b);
    const host = this.role === 'host' || (!this.role && G.mate && G.mate.L);
    return {
      v: 2, build: CFG.VERSION, at: new Date().toISOString(), result, mode: 'coop',
      where: `雙人 · 第 ${G.combat ? G.combat.wave : 0} 波（${host ? '房主 1P' : '隊友 2P'}）`,
      input: Input.touch ? `觸控（自動攻擊${Input.autoFire ? '開' : '關'}）` : '滑鼠鍵盤',
      ship: SHIPS[G.shipId].name, weapon: weaponTitle(G.weapon),
      time: Math.round(R ? R.time : 0), kills: G.kills || 0, dmg: Math.round(total), maxHit: Math.round(R ? R.maxHit : 0),
      chain: G.chain.map(name), inv: G.inventory.filter(Boolean).map(name), chipDmg: [],
      credits: G.credits, hp: Math.max(0, Math.ceil(G.player.hp)), maxHp: G.player.maxHp,
      cause: G.player.dead ? G.lastHit : '',
      coop: {
        role: host ? '房主' : '隊友',
        mate: mp ? `${SHIPS[mp.ship].name} · ${WEAPONS[mp.weapon].name} · 起始晶片 ${name(mp.chip) || '無'}` : '（不明）',
        mateDown: !!(G.mate && G.mate.dead),
        ping: ps.length ? { avg: Math.round(ps.reduce((a, b) => a + b, 0) / ps.length), min: ps[0],
          p90: ps[Math.floor(ps.length * 0.9)], max: ps[ps.length - 1], samples: ps.length } : '沒有量到',
        sync: host ? { inputsReceived: S.inputs, maxGapMs: Math.round(S.maxGap) } : { snapshotsReceived: S.snaps, maxGapMs: Math.round(S.maxGap) },
        note: host ? '傷害與擊殺是兩人合計（由房主統計）' : '傷害由房主統計，隊友這邊記為 0；擊殺是兩人合計',
      },
    };
  },

  // ---------- 房主 ----------
  applyInput(m) {  // 隊友傳來的位置與操作
    const p = Game.mate;
    if (!p || p.dead || Game.state !== 'play') return;
    p.x = clamp(num(m.x, p.x), p.r, CFG.WORLD_W - p.r); p.y = clamp(num(m.y, p.y), p.r, CFG.WORLD_H - p.r);
    p.vx = num(m.vx); p.vy = num(m.vy); p.aim = num(m.a, p.aim);
    p.moving = !!m.mv; p.dashT = clamp(num(m.dT), 0, CFG.DASH_TIME); p.wantFire = !!m.f;
    const ds = num(m.ds, p.dashSeq);
    if (ds > p.dashSeq) { p.dashSeq = ds; Game.withLoadout(p.L, () => p.onDash()); }  // 衝刺技能（震波、相位超載）由房主執行
  },
  hostUpdateMate(dt) {
    const m = Game.mate;
    if (m.dead) return;
    m.x = clamp(m.x + m.vx * dt, m.r, CFG.WORLD_W - m.r);  // 兩次輸入之間先照速度往前推
    m.y = clamp(m.y + m.vy * dt, m.r, CFG.WORLD_H - m.r);
    m.iframe -= dt; m.overdrive -= dt; m.fireCd -= dt; m.dashT -= dt;
    if (m.wantFire && m.fireCd <= 0) {
      Game.withLoadout(m.L, () => m.fire());
      m.fireCd = m.L.stats.interval;
    }
  },
  hostSend(dt) {
    this.sendAcc += dt;
    if (this.sendAcc < NET_RATE || !this.conn || !this.conn.open || !Game.inArena) return;
    this.sendAcc = 0;
    const G = Game, P = G.player, m = G.mate, r = Math.round;
    // 只傳隊友附近的子彈（畫面外的不用畫）
    const cx = m ? m.x : P.x, cy = m ? m.y : P.y, near = (x, y) => Math.abs(x - cx) < 1300 && Math.abs(y - cy) < 1000;
    const pal = [], palIdx = new Map();
    const ci = c => { let i = palIdx.get(c); if (i == null) { i = pal.length; pal.push(c); palIdx.set(c, i); } return i; };
    this.send({
      t: 's',
      p: [r(P.x), r(P.y), r2(P.aim), r2(P.hp), P.maxHp, r2(Math.max(0, P.dashT)), r2(Math.max(0, P.iframe)),
        P.overdrive > 0 ? 1 : 0, P.moving ? 1 : 0, P.dead ? 1 : 0, r(P.vx), r(P.vy)],
      me: m ? [r2(m.hp), m.maxHp, r2(Math.max(0, m.iframe)), m.dead ? 1 : 0, m.lastHit || ''] : null,
      e: G.enemies.filter(e => !e.dead).map(e => [e.id, e.type, r(e.x), r(e.y), r(e.vx), r(e.vy), r(e.hp), r(e.maxHp), r2(e.rot),
        e.flash > 0 ? 1 : 0, r2(Math.max(0, e.spawnT)), e.spawnMax, e.mode, r2(e.modeT), r2(e.chargeA),
        e.slowT > 0 ? 1 : 0, e.burnT > 0 ? 1 : 0, e.enraged ? 1 : 0]),
      b: G.bullets.filter(b => !b.dead && near(b.x, b.y)).map(b => [r(b.x), r(b.y), r2(b.angle), r(b.speed), r2(b.r),
        ci(b.color), b.shape, b.splits, b.payload ? 1 : 0, r2(b.life), r(Math.min(60, Math.hypot(b.x - b.sx, b.y - b.sy)))]),
      eb: G.eBullets.filter(b => near(b.x, b.y)).map(b => [r(b.x), r(b.y), r(b.vx), r(b.vy), b.r]),
      pk: G.pickups.map(c => [c.id, r(c.x), r(c.y), r2(c.life), r(c.vx), r(c.vy), c.vacuum ? 1 : 0]),
      mg: r(CFG.MAGNET_RANGE * (1 + G.passives.magnet)),  // 房主的拾取範圍（隊友那邊模擬晶體飛向房主時用）
      pal, c: G.credits, w: G.combat ? G.combat.wave : 0, k: G.kills,
      bn: G.banner ? [G.banner.text, G.banner.sub || '', r2(G.banner.t)] : null,
      fx: this.fxBuf,
    });
    this.fxBuf = [];
  },

  // ---------- 隊友 ----------
  clientUpdate(dt) {
    const G = Game, P = G.player;
    if (G.state === 'play') {
      G.time += dt;
      if (G.runStats) G.runStats.time += dt;
      if (!P.dead) P.update(dt);
      // 兩次戰場狀態之間：照速度往前推，畫面才會滑順
      for (const e of G.enemies) {
        e.modeT -= dt;
        if (e.spawnT > 0) e.spawnT -= dt;
        else { e.x += e.vx * dt; e.y += e.vy * dt; }
      }
      for (const b of G.bullets) { b.x += Math.cos(b.angle) * b.speed * dt; b.y += Math.sin(b.angle) * b.speed * dt; b.life -= dt; }
      for (const b of G.eBullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
      for (const c of G.pickups) {  // 晶體：用和房主一樣的算法飛向最近的玩家；碰到自己就先藏起來（房主那邊才真的入帳）
        if (c.gone) continue;
        const m = G.mate, dP = P.dead ? Infinity : dist2(c.x, c.y, P.x, P.y), dM = m && !m.dead ? dist2(c.x, c.y, m.x, m.y) : Infinity;
        if (dP <= dM && dP < Infinity) stepPickup(c, P, CFG.MAGNET_RANGE * (1 + G.passives.magnet), dP, dt);
        else if (dM < Infinity) stepPickup(c, m, this.mateMagnet || CFG.MAGNET_RANGE, dM, dt);
        if (dP < 20 * 20 || (dM < 20 * 20 && dP > dM)) c.gone = true;
      }
      G.pickups = G.pickups.filter(c => !c.gone || G.time - (c.goneT = c.goneT || G.time) < 1);  // 藏起來的留 1 秒，免得下一次同步又冒出來
      const m = G.mate;
      if (m && !m.dead) { m.x += m.vx * dt; m.y += m.vy * dt; m.iframe -= dt; m.dashT -= dt; }
      this.inAcc += dt;
      if (this.inAcc >= NET_RATE && !P.dead) {
        this.inAcc = 0;
        this.send({ t: 'i', x: Math.round(P.x), y: Math.round(P.y), vx: Math.round(P.vx), vy: Math.round(P.vy), a: r2(P.aim),
          mv: P.moving ? 1 : 0, dT: r2(Math.max(0, P.dashT)), ds: P.dashSeq || 0, f: P.wantFire ? 1 : 0 });
      }
    }
    if (G.state === 'play' || G.state === 'dead') G.updateFx(dt);
    if (G.inArena) G.updateCamera(dt);
  },
  applySnap(s) {
    const G = Game;
    if (G.mode !== 'coop' || !G.combat || !G.inArena || (G.state !== 'play' && G.state !== 'dead')) return;
    const arr = v => (Array.isArray(v) ? v : []);
    const m = G.mate, p = s.p;
    if (m && Array.isArray(p)) {
      m.x = num(p[0], m.x); m.y = num(p[1], m.y); m.aim = num(p[2]); m.hp = num(p[3]); m.maxHp = num(p[4], m.maxHp);
      m.dashT = num(p[5]); m.iframe = num(p[6]); m.overdrive = p[7] ? 1 : 0; m.moving = !!p[8]; m.dead = !!p[9];
      m.vx = num(p[10]); m.vy = num(p[11]);
    }
    const P = G.player;
    if (Array.isArray(s.me)) {  // 自己的血量以房主為準
      const hp = num(s.me[0], P.hp);
      if (hp < P.hp - 0.01 && !P.dead) {
        G.shake(9); SFX.play(hp <= 0 ? 'death' : 'hurt');
        burst(P.x, P.y, '#ff4d6d', 16, 240, 0.4, 2);
      }
      P.hp = hp; P.maxHp = num(s.me[1], P.maxHp);
      if (s.me[2] > 0) P.iframe = num(s.me[2]);
      if (typeof s.me[4] === 'string') G.lastHit = s.me[4].slice(0, 60);
      if (s.me[3] && !P.dead) { P.dead = true; Input.down = false; burst(P.x, P.y, P.ship.color, 80, 400, 1.2, 3); G.shake(20); }
    }
    G.enemies = arr(s.e).map(a => {
      const t = ENEMY_TYPES[a[1]];
      if (!t) return null;
      return { id: a[0], type: a[1], t, r: t.radius, x: num(a[2]), y: num(a[3]), vx: num(a[4]), vy: num(a[5]),
        hp: num(a[6]), maxHp: num(a[7], 1), rot: num(a[8]), flash: a[9] ? 0.08 : 0, spawnT: num(a[10]), spawnMax: num(a[11], 1) || 1,
        mode: a[12], modeT: num(a[13]), chargeA: num(a[14]), slowT: a[15] ? 1 : 0, burnT: a[16] ? 1 : 0, enraged: !!a[17], dead: false };
    }).filter(Boolean);
    const pal = arr(s.pal);
    G.bullets = arr(s.b).map(a => {
      const ang = num(a[2]), tl = num(a[10]);
      return { x: num(a[0]), y: num(a[1]), angle: ang, speed: num(a[3]), r: num(a[4], 3), color: typeof pal[a[5]] === 'string' ? pal[a[5]] : '#fff',
        shape: a[6], splits: num(a[7]), payload: !!a[8], life: num(a[9], 1),
        sx: num(a[0]) - Math.cos(ang) * tl, sy: num(a[1]) - Math.sin(ang) * tl };
    });
    G.eBullets = arr(s.eb).map(a => ({ x: num(a[0]), y: num(a[1]), vx: num(a[2]), vy: num(a[3]), r: num(a[4], 5) }));
    // 晶體：隊友這邊自己模擬飛行（見 clientUpdate），房主的位置只拿來慢慢修正，不直接跳過去
    this.mateMagnet = num(s.mg, CFG.MAGNET_RANGE);
    const had = new Map(G.pickups.map(c => [c.id, c]));
    G.pickups = arr(s.pk).map(a => {
      const id = a[0], x = num(a[1]), y = num(a[2]), c = had.get(id);
      if (!c) return { id, x, y, life: num(a[3], 5), vx: num(a[4]), vy: num(a[5]), vacuum: !!a[6] };
      if (c.gone) return c;
      c.x += (x - c.x) * 0.25; c.y += (y - c.y) * 0.25;
      c.life = num(a[3], c.life); c.vacuum = !!a[6];
      return c;
    });
    G.credits = num(s.c, G.credits); G.kills = num(s.k, G.kills); G.combat.wave = num(s.w, G.combat.wave);
    G.banner = Array.isArray(s.bn) ? { text: String(s.bn[0]), sub: String(s.bn[1] || ''), t: num(s.bn[2], 1) } : null;
    for (const f of arr(s.fx)) {  // 房主那邊發生的特效與音效
      if (!Array.isArray(f)) continue;
      switch (f[0]) {
        case 'b': burst(num(f[1]), num(f[2]), String(f[3]), Math.min(150, num(f[4])), num(f[5], 200), num(f[6], 0.5), num(f[7], 2)); break;
        case 't': floatText(num(f[1]), num(f[2]), String(f[3]), String(f[4]), !!f[5]); break;
        case 's': SFX.play(String(f[1]), f[2]); break;
        case 'r': if (G.rings.length < 40) G.rings.push({ x: num(f[1]), y: num(f[2]), r: num(f[3], 40), life: 0.3, max: 0.3, color: String(f[4]) }); break;
        case 'z': if (G.zaps.length < 60) G.zaps.push({ x1: num(f[1]), y1: num(f[2]), x2: num(f[3]), y2: num(f[4]), life: 0.18, max: 0.18 }); break;
      }
    }
  },
};
addEventListener('beforeunload', () => Net.close());

// =====================================================================
// RENDER（戰鬥畫面）
// =====================================================================
function initStars() {
  for (let i = 0; i < 240; i++)
    Game.stars.push({ u: Math.random(), v: Math.random(), z: [0.15, 0.35, 0.6][i % 3], s: rand(0.6, 1.8), a: rand(0.3, 0.9) });
}

function polygon(x, y, r, sides, rot) {
  ctx.beginPath();
  for (let i = 0; i < sides; i++) {
    const a = rot + i / sides * TAU;
    i ? ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05060f';
  ctx.fillRect(0, 0, VW, VH);
  const c = Game.cam;
  for (const s of Game.stars) {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#9fb4ff';
    ctx.fillRect(mod(s.u * VW - c.x * s.z, VW), mod(s.v * VH - c.y * s.z, VH), s.s, s.s);
  }
  ctx.globalAlpha = 1;
  if (!Game.inArena) return;

  const sx = c.shake ? rand(-c.shake, c.shake) : 0, sy = c.shake ? rand(-c.shake, c.shake) : 0;
  ctx.save();
  ctx.scale(ZOOM, ZOOM);
  ctx.translate(-c.x + sx, -c.y + sy);
  drawWorld();
  ctx.restore();
  drawHUD();
  if (Input.touch && Game.state === 'play') drawSticks();
}

function drawSticks() {
  const draw = (s, color) => {
    if (!s) return;
    const v = stickVec(s);
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(s.bx, s.by, 60, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.8; ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(s.bx + v.x * 60, s.by + v.y * 60, 22, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  };
  draw(Input.joy, '#4cc9f0');
  draw(Input.aimStick, '#ff6b9d');
  if (!Input.joy && !Input.aimStick && Game.time < 8) {
    ctx.font = '13px Microsoft JhengHei'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(143, 163, 217, 0.8)';
    if (Input.autoFire) ctx.fillText('任意位置拖曳：移動　·　自動攻擊中', VW / 2, VH * 0.62);
    else {
      ctx.fillText('左半邊拖曳：移動', VW * 0.25, VH * 0.62);
      ctx.fillText('右半邊按住：射擊（拖曳瞄準）', VW * 0.75, VH * 0.62);
    }
  }
}

function drawWorld() {
  const c = Game.cam, W = CFG.WORLD_W, H = CFG.WORLD_H;
  ctx.strokeStyle = 'rgba(60, 90, 180, 0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const g = 80;
  for (let x = Math.max(0, Math.floor(c.x / g) * g); x <= Math.min(W, c.x + ZW); x += g) { ctx.moveTo(x, Math.max(0, c.y)); ctx.lineTo(x, Math.min(H, c.y + ZH)); }
  for (let y = Math.max(0, Math.floor(c.y / g) * g); y <= Math.min(H, c.y + ZH); y += g) { ctx.moveTo(Math.max(0, c.x), y); ctx.lineTo(Math.min(W, c.x + ZW), y); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(76, 201, 240, 0.6)';
  ctx.lineWidth = 3;
  ctx.strokeRect(0, 0, W, H);

  ctx.fillStyle = '#ffd166';
  for (const p of Game.pickups) {
    if (p.gone || (p.life < 3 && Math.floor(p.life * 8) % 2)) continue;
    polygon(p.x, p.y, 5, 4, Game.time * 3);
    ctx.fill();
  }

  for (const e of Game.enemies) drawEnemy(e);
  ctx.globalAlpha = 1;

  ctx.globalCompositeOperation = 'lighter';
  for (const b of Game.eBullets) {
    ctx.fillStyle = 'rgba(247, 37, 133, 0.3)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff8fc7';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
  }
  for (const b of Game.bullets) drawBullet(b);
  for (const z of Game.zaps) {  // 電弧：鋸齒狀的閃電
    ctx.globalAlpha = z.life / z.max;
    ctx.strokeStyle = '#9fe8ff'; ctx.lineWidth = 2;
    const dx = z.x2 - z.x1, dy = z.y2 - z.y1, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
    ctx.beginPath(); ctx.moveTo(z.x1, z.y1);
    for (let k = 1; k < 6; k++) { const j = rand(-10, 10); ctx.lineTo(z.x1 + dx * k / 6 + nx * j, z.y1 + dy * k / 6 + ny * j); }
    ctx.lineTo(z.x2, z.y2); ctx.stroke();
  }
  for (const r of Game.rings) {  // 爆炸光圈
    const t = 1 - r.life / r.max;
    ctx.globalAlpha = r.life / r.max;
    ctx.strokeStyle = r.color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (0.4 + 0.6 * t), 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const q of Game.particles) {
    ctx.globalAlpha = q.life / q.max;
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  const tg = Game.player.target;
  if (Input.touch && tg && !tg.dead) {  // 自動攻擊的鎖定框
    const r = tg.r + 10, s = Game.time * 3;
    ctx.strokeStyle = 'rgba(157, 255, 107, 0.85)'; ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.arc(tg.x, tg.y, r, s + i * TAU / 4, s + i * TAU / 4 + 0.6); ctx.stroke();
    }
  }
  if (Game.mate && !Game.mate.dead) drawPlayer(Game.mate, Net.role === 'host' ? '2P' : '1P');
  if (Game.state !== 'dead' && !Game.player.dead) drawPlayer(Game.player, Game.mate ? (Net.role === 'host' ? '1P' : '2P') : '');

  ctx.textAlign = 'center';
  for (const t of Game.texts) {
    ctx.globalAlpha = Math.min(1, t.life * 2);
    ctx.font = t.big ? 'bold 16px Microsoft JhengHei' : '11px Segoe UI';
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawEnemy(e) {
  const sp = e.spawnT > 0 ? 1 - e.spawnT / e.spawnMax : 1;
  ctx.globalAlpha = 0.3 + 0.7 * sp;
  const rot = e.type === 'swarmer' ? Math.atan2(e.vy, e.vx)
    : e.type === 'spitter' ? Math.atan2(Game.player.y - e.y, Game.player.x - e.x) : e.rot;
  if (e.type === 'elite') {
    if (e.mode === 'windup') {  // 衝鋒預警線
      ctx.strokeStyle = `rgba(255, 212, 0, ${0.3 + 0.5 * Math.sin(Game.time * 30) ** 2})`;
      ctx.lineWidth = e.r * 1.4;
      ctx.beginPath(); ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + Math.cos(e.chargeA) * 320, e.y + Math.sin(e.chargeA) * 320); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255, 212, 0, 0.35)'; ctx.lineWidth = 1;
    polygon(e.x, e.y, e.r * 1.5 * sp, 5, -e.rot * 0.7); ctx.stroke();
  }
  if (e.type === 'brute' && e.mode === 'windup') {  // 刺殼：滾球預警線（最後鎖定方向時變亮）
    const len = CFG.BRUTE.rollSpeed * CFG.BRUTE.rollT, locked = e.modeT <= CFG.BRUTE.lock;
    ctx.globalAlpha = locked ? 0.55 : 0.2;
    ctx.strokeStyle = e.t.color; ctx.lineWidth = e.r * 1.6;
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + Math.cos(e.chargeA) * len, e.y + Math.sin(e.chargeA) * len); ctx.stroke();
    ctx.globalAlpha = 0.3 + 0.7 * sp;
  }
  if (e.type === 'boss2' && e.mode === 'windup') {  // 裂界獵艦：衝鋒預警線
    ctx.globalAlpha = 0.25 + 0.45 * Math.sin(Game.time * 30) ** 2;
    ctx.strokeStyle = e.t.color; ctx.lineWidth = e.r * 1.6;
    ctx.beginPath(); ctx.moveTo(e.x, e.y);
    ctx.lineTo(e.x + Math.cos(e.chargeA) * 520, e.y + Math.sin(e.chargeA) * 520); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // 刺殼縮球／滾動時變小、變成圓一點（12 邊形）；暈眩時閃爍
  const curled = e.type === 'brute' && (e.mode === 'windup' || e.mode === 'charge');
  if (e.type === 'brute' && e.mode === 'stun' && Math.floor(Game.time * 10) % 2) ctx.globalAlpha *= 0.5;
  polygon(e.x, e.y, e.r * sp * (curled ? 0.85 : 1), curled ? 12 : e.t.shape, e.type === 'boss2' && e.mode !== 'chase' ? e.chargeA : rot);
  ctx.fillStyle = e.flash > 0 ? '#ffffff' : e.t.color + '33';
  ctx.fill();
  ctx.strokeStyle = e.flash > 0 ? '#ffffff' : e.t.color;
  ctx.lineWidth = e.type === 'elite' || e.t.boss ? 3 : 2;
  ctx.stroke();
  if (e.t.boss) {  // 旗艦：反向旋轉的內環與脈動核心（暴走時轉成金色）
    const inner = { boss: 4, boss2: 3, boss3: 6 }[e.type] || 4;
    ctx.strokeStyle = e.enraged ? '#ffd166' : e.t.color; ctx.lineWidth = 2;
    polygon(e.x, e.y, e.r * 0.62 * sp, inner, -e.rot * 1.6); ctx.stroke();
    if (e.type === 'boss3') { polygon(e.x, e.y, e.r * 1.35 * sp, 6, e.rot * 0.5); ctx.globalAlpha *= 0.4; ctx.stroke(); ctx.globalAlpha = 0.3 + 0.7 * sp; }
    const pulse = 0.5 + 0.5 * Math.sin(Game.time * (e.enraged ? 12 : 5));
    ctx.globalAlpha = (0.3 + 0.7 * sp) * (0.4 + pulse * 0.5);
    ctx.fillStyle = e.enraged ? '#ffd166' : e.t.color;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.28 * sp, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.3 + 0.7 * sp;
  }
  if (e.slowT > 0) {  // 減速：藍色外圈
    ctx.strokeStyle = 'rgba(127, 212, 255, 0.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 5, 0, TAU); ctx.stroke();
  }
  if (e.burnT > 0) {  // 燃燒：橘色閃爍
    ctx.strokeStyle = `rgba(255, 159, 28, ${0.4 + 0.4 * Math.sin(Game.time * 20)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 2, 0, TAU); ctx.stroke();
  }
  if (e.spawnT > 0) {
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * (2.2 - sp), 0, TAU);
    ctx.strokeStyle = e.t.color; ctx.lineWidth = 1; ctx.stroke();
  }
  if (e.hp < e.maxHp && e.type !== 'swarmer' && !e.t.boss) {
    const w = e.type === 'elite' ? e.r * 3 : e.r * 2;
    ctx.fillStyle = '#300'; ctx.fillRect(e.x - w / 2, e.y - e.r - 12, w, 4);
    ctx.fillStyle = e.t.color; ctx.fillRect(e.x - w / 2, e.y - e.r - 12, w * Math.max(0, e.hp / e.maxHp), 4);
  }
}

// 子彈尾巴的長度：最長 max，但不超過從發射點飛過的距離
const tail = (b, max) => Math.min(max, Math.hypot(b.x - b.sx, b.y - b.sy));

function drawBullet(b) {
  const cos = Math.cos(b.angle), sin = Math.sin(b.angle);
  ctx.fillStyle = b.color; ctx.strokeStyle = b.color;
  if (b.shape === 'rail') {
    ctx.lineWidth = b.r + 2; ctx.lineCap = 'round';
    ctx.globalAlpha = 0.35;
    const t1 = tail(b, 60), t2 = tail(b, 34);
    ctx.beginPath(); ctx.moveTo(b.x - cos * t1, b.y - sin * t1); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = b.r * 0.6; ctx.strokeStyle = '#fff6d8';
    ctx.beginPath(); ctx.moveTo(b.x - cos * t2, b.y - sin * t2); ctx.lineTo(b.x, b.y); ctx.stroke();
  } else if (b.shape === 'blade') {  // 垂直於飛行方向的弧形刃片
    const w = b.r * 1.6, a0 = Math.min(1, b.life * 6);
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    // 被分裂過的刃片：後方拖出殘影、中心變白。分裂出的刃片會疊在一起，沒有這個提示看起來就像同一片
    for (let k = b.splits * 2; k >= 1; k--) {
      const bx = b.x - cos * k * 6, by = b.y - sin * k * 6, ww = w * (1 - k * 0.08);
      ctx.globalAlpha = a0 * 0.35 / k;
      ctx.beginPath(); ctx.moveTo(bx - sin * ww, by + cos * ww); ctx.lineTo(bx + sin * ww, by - cos * ww); ctx.stroke();
    }
    ctx.globalAlpha = a0;
    ctx.beginPath(); ctx.moveTo(b.x - sin * w, b.y + cos * w); ctx.lineTo(b.x + sin * w, b.y - cos * w); ctx.stroke();
    if (b.splits) {
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(b.x - sin * w * 0.7, b.y + cos * w * 0.7); ctx.lineTo(b.x + sin * w * 0.7, b.y - cos * w * 0.7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else if (b.shape === 'line') {
    ctx.lineWidth = b.r; ctx.lineCap = 'round';
    const t = tail(b, 18);
    ctx.beginPath(); ctx.moveTo(b.x - cos * t, b.y - sin * t); ctx.lineTo(b.x, b.y); ctx.stroke();
  } else if (b.shape === 'dart') {
    ctx.beginPath();
    ctx.moveTo(b.x + cos * b.r * 2.2, b.y + sin * b.r * 2.2);
    ctx.lineTo(b.x - cos * b.r * 1.5 - sin * b.r, b.y - sin * b.r * 1.5 + cos * b.r);
    ctx.lineTo(b.x - cos * b.r * 1.5 + sin * b.r, b.y - sin * b.r * 1.5 - cos * b.r);
    ctx.closePath(); ctx.fill();
  } else {
    if (b.shape === 'orb') {
      ctx.globalAlpha = 0.3;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.8, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
  }
  if (b.payload) {  // 帶有命中觸發的子彈：粉色外環
    ctx.strokeStyle = '#ff6b9d'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 4, 0, TAU); ctx.stroke();
  }
}

function drawPlayer(p, tag = '') {
  if (tag) {  // 雙人：船上方標示 1P / 2P
    ctx.font = 'bold 11px Segoe UI'; ctx.textAlign = 'center'; ctx.fillStyle = p.ship.color;
    ctx.fillText(tag, p.x, p.y - p.r - 12);
  }
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.aim);
  if (p.iframe > 0 && Math.floor(Game.time * 20) % 2) ctx.globalAlpha = 0.35;
  const S = p.ship;
  if (p.moving) {
    ctx.fillStyle = `rgba(255, 159, 28, ${rand(0.5, 0.9)})`;
    ctx.beginPath(); ctx.moveTo(-6, -4); ctx.lineTo(-6 - rand(8, 14), 0); ctx.lineTo(-6, 4); ctx.fill();
  }
  const hot = p.dashT > 0 || p.overdrive > 0;
  ctx.shadowBlur = hot ? 28 : 16; ctx.shadowColor = S.color;
  ctx.beginPath();
  S.hull.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath();
  ctx.globalAlpha *= hot ? 0.7 : 0.28;
  ctx.fillStyle = S.color; ctx.fill();
  ctx.globalAlpha = p.iframe > 0 && Math.floor(Game.time * 20) % 2 ? 0.35 : 1;
  ctx.strokeStyle = S.color; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function drawHUD() {
  const p = Game.player, s = Game.stats, C = Game.combat, T = Input.touch;
  const hpW = Math.min(220, VW * 0.42);
  ctx.fillStyle = 'rgba(10, 16, 40, 0.8)'; ctx.fillRect(20, 20, hpW + 4, 18);
  ctx.fillStyle = p.hp / p.maxHp > 0.3 ? '#4cc9f0' : '#ff4d6d';
  ctx.fillRect(22, 22, hpW * p.hp / p.maxHp, 14);
  ctx.font = 'bold 12px Segoe UI'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
  ctx.fillText(`HP ${Math.ceil(p.hp)} / ${p.maxHp}`, 28, 33);
  // 衝刺冷卻
  const dashMax = p.ship.dashCd * (1 - Game.passives.dashCd), dr = 1 - clamp(p.dashCd / dashMax, 0, 1);
  ctx.fillStyle = 'rgba(10, 16, 40, 0.8)'; ctx.fillRect(20, 42, 110, 8);
  ctx.fillStyle = dr >= 1 ? '#bdf0ff' : '#35508a'; ctx.fillRect(21, 43, 108 * dr, 6);
  ctx.font = '10px Microsoft JhengHei'; ctx.fillStyle = '#8fa3d9';
  ctx.fillText(T ? '衝刺' : '衝刺 [Space/右鍵]', 136, 50);
  ctx.fillStyle = '#ffd166'; ctx.font = 'bold 14px Segoe UI';
  ctx.fillText(`◆ ${Game.credits}`, 20, 72);
  ctx.fillStyle = p.ship.color; ctx.font = 'bold 12px Microsoft JhengHei';
  ctx.fillText(p.ship.name + (p.overdrive > 0 ? '　相位超載 ×1.5' : ''), 72, 72);
  const m = Game.mate;
  if (m) {  // 雙人：隊友血條
    const mw = Math.min(160, VW * 0.3), tag = Net.role === 'host' ? '2P' : '1P';
    ctx.fillStyle = 'rgba(10, 16, 40, 0.8)'; ctx.fillRect(20, 82, mw + 4, 12);
    ctx.fillStyle = m.dead ? '#555' : m.ship.color; ctx.fillRect(22, 84, mw * Math.max(0, m.hp) / m.maxHp, 8);
    ctx.font = '11px Microsoft JhengHei'; ctx.fillStyle = m.dead ? '#ff4d6d' : '#cfe8ff';
    ctx.fillText(`${tag} ${m.ship.name}${m.dead ? '　已被擊墜' : `　HP ${Math.ceil(m.hp)}`}`, mw + 32, 93);
  }

  ctx.textAlign = 'right'; ctx.fillStyle = '#cfe8ff'; ctx.font = `bold ${VW < 500 ? 13 : 16}px Microsoft JhengHei`;
  ctx.fillText(C.sandbox ? `${Game.mode === 'coop' ? '雙人' : '沙盒'} · WAVE ${C.wave}` : `${NODE_META[Game.node.type].label} · WAVE ${C.wave} / ${C.wavesTotal}`, VW - 20, 34);
  ctx.font = '12px Microsoft JhengHei'; ctx.fillStyle = '#8fa3d9';
  ctx.fillText(`擊殺 ${Game.kills}　子彈 ${Game.bullets.length}`, VW - 20, 54);
  if (Game.mode === 'coop' && Net.active()) {  // 雙人：連線延遲（綠 < 80ms、黃 < 150ms、紅）
    ctx.font = `bold ${VW < 500 ? 13 : 15}px Microsoft JhengHei`; ctx.fillStyle = Net.pingColor(Net.ping);
    ctx.fillText(Net.ping == null ? '連線延遲 測量中…' : `連線延遲 ${Net.ping} ms`, VW - 20, 76);
  }

  // 電路鏈縮圖（觸控時移到上方，避開拇指）
  const n = Game.chain.length, w = T ? 40 : 54, gap = T ? 5 : 8, total = n * w + (n - 1) * gap;
  let x = VW / 2 - total / 2;
  const y = T ? 84 : VH - 70;
  ctx.textAlign = 'center';
  for (let i = 0; i < n; i++) {
    const id = Game.chain[i];
    ctx.fillStyle = 'rgba(10, 16, 48, 0.85)'; ctx.fillRect(x, y, w, 40);
    if (id) {
      const col = id === 'weapon' ? Game.wp.color : TYPE_META[CHIPS[id].type].color;
      ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 39);
      ctx.fillStyle = col; ctx.font = `bold ${T ? 11 : 13}px Microsoft JhengHei`;
      ctx.fillText(CHIPS[id].short, x + w / 2, y + 25);
    } else {
      ctx.strokeStyle = '#2f3f78'; ctx.setLineDash([3, 3]); ctx.strokeRect(x + 0.5, y + 0.5, w - 1, 39); ctx.setLineDash([]);
    }
    if (i < n - 1) {
      ctx.fillStyle = '#4c5a8f'; ctx.font = '12px Segoe UI';
      ctx.fillText('→', x + w + gap / 2, y + 25);
    }
    x += w + gap;
  }
  ctx.font = '11px Microsoft JhengHei'; ctx.fillStyle = '#8fa3d9';
  if (T) ctx.fillText(`每發 ${s.count} 顆 · 射速 ${s.rps.toFixed(1)}/秒`, VW / 2, y + 56);
  else {
    ctx.fillText(`每發 ${s.count} 顆 · 射速 ${s.rps.toFixed(1)}/秒 · ⚡${s.heat}　[Tab] 編輯電路`, VW / 2, VH - 16);
    ctx.textAlign = 'left'; ctx.fillStyle = '#4a5886';
    ctx.fillText('WASD 移動 · 左鍵射擊 · Space 衝刺', 20, VH - 16);
  }

  const boss = Game.enemies.find(e => e.t.boss && !e.dead);
  if (boss) {  // Boss 血條
    const bw = Math.min(520, VW - 40), bx = VW / 2 - bw / 2, by = T ? VH - 44 : VH - 112;
    ctx.fillStyle = 'rgba(20, 6, 14, 0.85)'; ctx.fillRect(bx - 2, by - 2, bw + 4, 14);
    ctx.fillStyle = boss.enraged ? '#ffd166' : '#ff4d6d';
    ctx.fillRect(bx, by, bw * Math.max(0, boss.hp / boss.maxHp), 10);
    ctx.textAlign = 'center'; ctx.font = 'bold 13px Microsoft JhengHei'; ctx.fillStyle = '#ffd3dc';
    ctx.fillText(`♛ ${boss.t.name}${boss.enraged ? '（暴走）' : ''}`, VW / 2, by - 6);
  }

  if (Game.banner) {
    ctx.globalAlpha = Math.min(1, Game.banner.t);
    ctx.textAlign = 'center'; ctx.font = 'bold 36px Microsoft JhengHei'; ctx.fillStyle = '#4cc9f0';
    ctx.fillText(Game.banner.text, VW / 2, VH * 0.22);
    if (Game.banner.sub) {
      ctx.font = 'bold 16px Microsoft JhengHei'; ctx.fillStyle = '#ffd400';
      ctx.fillText(Game.banner.sub, VW / 2, VH * 0.22 + 30);
    }
    ctx.globalAlpha = 1;
  }
}

// =====================================================================
// SCREENS — DOM 畫面（標題 / 航圖 / 獎勵 / 商店 / 結算）
// =====================================================================
function chipCard(id, footer = '') {
  const d = CHIPS[id], m = TYPE_META[d.type];
  const ps = d.stored ? `<div class="ps">倉庫被動：${Object.entries(d.stored).map(([k, v]) => PASSIVE_LABEL[k](v)).join('、')}</div>` : '';
  const lv = !d.lv && LV_INFO[id] ? `<div class="ty" style="line-height:1.6">${lvLine(id, 1)}</div>` : '';  // Lv2+ 的說明已寫在 desc 裡
  return `<div class="card t-${d.type}">
    <div class="ty" style="color:${m.color}">${m.icon} ${m.label} · ⚡${d.cost}</div>
    <div class="ttl">${d.name}</div>
    <div class="ds">${d.desc}</div>${lv}${ps}${footer}</div>`;
}

const Screen = {
  el: document.getElementById('screen'),
  show(html) { this.el.innerHTML = html; this.el.classList.remove('hidden'); },
  hide() {
    this.el.classList.add('hidden');
    if (document.activeElement) document.activeElement.blur();  // 避免 Space/Enter 再次觸發按鈕
  },
  status() {
    const p = Game.player;
    return `<div class="row"><span class="pill">HP ${Math.ceil(p.hp)} / ${p.maxHp}</span>
      <span class="pill gold">◆ ${Game.credits}</span><button data-act="editor">整理電路 (Tab)</button></div>`;
  },
  // 所有畫面按鈕用 data-act 委派，不使用 inline onclick
  act(btn) {
    const a = btn.dataset.act, arg = btn.dataset.arg;
    if (btn.disabled) return;
    SFX.init();
    SFX.play('click');
    switch (a) {
      case 'mute': SFX.setMuted(!SFX.muted); break;
      case 'codex': Codex.open('rules'); break;
      case 'run': this.restart(); break;
      case 'editor': Game.toggleEditor(); break;
      case 'reward': Game.takeReward(arg || null); break;
      case 'buy': Game.buy(+arg); break;
      case 'leave': Game.showMap(); break;
      case 'node': Game.enterNode(Game.nodeById(arg)); break;
      case 'title': Net.leave(); Game.mate = null; Game.state = 'title'; Game.inArena = false; Screen.title(); break;
      case 'select': Screen.select(arg); break;
      case 'ship': { const [mode, ship] = arg.split(':'); Screen.weaponSelect(mode, ship); break; }
      case 'weapon': {
        const [mode, ship, wid] = arg.split(':');
        if (mode === 'sandbox') Game.newRun(mode, ship, wid); else this.chipPick(mode, ship, wid);
        break;
      }
      case 'startchip': {  // 開局三選一晶片選好了
        const [mode, ship, wid, chip] = arg.split(':');
        if (mode === 'coop') Net.ready(ship, wid, chip); else Game.newRun(mode, ship, wid, chip);
        break;
      }
      case 'coop': Net.lobby(); break;
      case 'nethost': Net.host(); break;
      case 'netjoin': Net.join(document.getElementById('netCode').value); break;
      case 'netstart': Net.beginPick(); break;
      case 'netroom': Net.backToRoom(); break;
      case 'upg': Game.upgradeWeapon(arg); break;
      case 'armorybonus': Game.armoryBonus(); break;
      case 'slot': Game.expandSlot(arg); break;
      case 'bhpick': Game.bhToggle(arg); break;
      case 'bhfuse': Game.bhFuse(); break;
      case 'scrap': Game.removeScrap(); break;
      case 'next': Game.nextSector(); break;
      case 'finish': Game.finishRun(); break;
      case 'records': Screen.records(); break;
      case 'clearrec': Screen.records('', true); break;  // 先在畫面上確認一次
      case 'clearrecok':
        try { localStorage.removeItem('runRecords'); } catch (e) {}
        Screen.records('已刪除所有紀錄。');
        break;
      case 'copyrec': Screen.copyRecords(); break;
      case 'copyrun': Screen.copyRun(); break;
      case 'copyone': Screen.copyOne(+arg); break;
      case 'heal': Game.shopHeal(); break;
      case 'music': Music.toggle(); Screen.title(); break;
    }
  },

  select(mode) {
    const bar = (label, v, max, col) => `<div class="ty">${label}
      <div style="height:6px;background:#141c3a;border-radius:3px;margin-top:3px">
      <div style="height:6px;width:${Math.round(v / max * 100)}%;background:${col};border-radius:3px"></div></div></div>`;
    const cards = Object.entries(SHIPS).map(([id, S]) => {
      const pts = S.hull.map(([x, y]) => `${x},${y}`).join(' ');
      return `<div class="card" style="border-color:${S.color}">
        <svg viewBox="-26 -26 52 52" width="72" height="72" style="margin:0 auto;display:block;transform:rotate(-90deg)">
          <polygon points="${pts}" fill="${S.color}" fill-opacity=".3" stroke="${S.color}" stroke-width="2"/></svg>
        <div class="ttl" style="color:${S.color};text-align:center">${S.name}<span class="ty" style="margin-left:6px">${S.en}</span></div>
        <div class="ds">${S.desc}</div>
        ${bar(`船體 ${S.hp}`, S.hp, 150, S.color)}
        ${bar(`速度 ${S.speed}`, S.speed, 310, S.color)}
        ${bar(`衝刺冷卻 ${S.dashCd} 秒`, 1.4 - S.dashCd, 0.85, S.color)}
        <div class="ds"><b style="color:${S.color}">技能・${S.abilityName}</b><br>${S.abilityDesc}</div>
        <button data-act="ship" data-arg="${mode}:${id}">選擇${S.name}</button></div>`;
    }).join('');
    this.show(`<div class="scr">
      <div class="between"><div><h2>1 / ${mode === 'sandbox' ? 2 : 3}　選擇飛船</h2>
        <div class="sub">${mode === 'run' ? '開始遠征' : mode === 'coop' ? '雙人連線' : '沙盒模式'}：每艘飛船有不同的船體性能與衝刺技能。下一步選武器${mode === 'sandbox' ? '' : '，最後三選一起始晶片'}。</div></div>
        <button data-act="title">${mode === 'coop' ? '離開房間' : '返回'}</button></div>
      <div class="cards">${cards}</div></div>`);
  },

  weaponSelect(mode, shipId) {
    const S = SHIPS[shipId];
    const cards = Object.entries(WEAPONS).map(([id, W]) => {
      const p = weaponParams({ id, path: null, final: null });
      const dps = p.damage * p.count / p.interval;
      const paths = Object.values(W.paths).map(P =>
        `<div><b style="color:${W.color}">${P.name}</b>：${P.desc}<br><span style="color:#6a79ad">→ ${P.next.map(n => n.name).join(' ／ ')}</span></div>`).join('');
      return `<div class="card" style="border-color:${W.color}">
        <div class="ttl" style="color:${W.color}">${W.name}</div>
        <div class="ds">${W.desc}</div>
        <div class="ty">單發 ${p.damage} × ${p.count}　·　每秒 ${(1 / p.interval).toFixed(1)} 次　·　基礎 DPS 約 ${Math.round(dps)}　·　擊退 ${p.knock}</div>
        <div class="ds" style="font-size:11px;display:grid;gap:6px">${paths}</div>
        <button data-act="weapon" data-arg="${mode}:${shipId}:${id}">使用${W.name}</button></div>`;
    }).join('');
    this.show(`<div class="scr">
      <div class="between"><div><h2>2 / ${mode === 'sandbox' ? 2 : 3}　選擇武器</h2>
        <div class="sub">飛船：<b style="color:${S.color}">${S.name}</b>。武器這一場固定不換，在「⚒ 軍械台」升級兩段：第一段 3 選 1，第二段 2 選 1。</div></div>
        <button data-act="select" data-arg="${mode}">返回</button></div>
      <div class="cards">${cards}</div></div>`);
  },

  // 開局三選一起始晶片（遠征與雙人；取代以前飛船自帶的晶片）
  chipPick(mode, shipId, weaponId) {
    const S = SHIPS[shipId], W = WEAPONS[weaponId];
    const cards = pickN(NORMAL_IDS, 3).map(id =>
      chipCard(id, `<button data-act="startchip" data-arg="${mode}:${shipId}:${weaponId}:${id}">選這個</button>`)).join('');
    this.show(`<div class="scr">
      <div class="between"><div><h2>3 / 3　起始晶片（三選一）</h2>
        <div class="sub"><b style="color:${S.color}">${S.name}</b> ＋ <b style="color:${W.color}">${W.name}</b>。選好的晶片直接裝在電路第 2 格（武器右邊）。</div></div>
        <button data-act="ship" data-arg="${mode}:${shipId}">返回</button></div>
      <div class="cards">${cards}</div></div>`);
  },
  // 死亡畫面的「重新開始」：遠征要重新選起始晶片，沙盒直接開
  restart() {
    if (Game.mode === 'run') this.chipPick('run', Game.shipId, Game.weapon.id);
    else Game.newRun(Game.mode);
  },

  // 武器升級只能在軍械台（補給站不賣武器升級）
  armory() {
    const W = WEAPONS[Game.weapon.id], st = Game.weapon, stage = Game.weaponStage();
    let body;
    const card = (key, n, color) => `<div class="card" style="border-color:${color}">
      <div class="ttl" style="color:${color}">${n.name}</div><div class="ds">${n.desc}</div>
      ${n.next ? `<div class="ty">第二段可選：${n.next.map(x => x.name).join(' ／ ')}</div>` : ''}
      <button data-act="upg" data-arg="${key}">選擇</button></div>`;
    // 軍械台一律給武器升級；只有武器升滿之後，才可以改選「電路擴充」
    const canSlot = stage === 2 && Game.chain.length < CFG.MAX_SLOTS;
    const slotCard = canSlot ? `<div class="card" style="border-color:#2ee6a6">
      <div class="ttl" style="color:#2ee6a6">⚡ 電路擴充</div>
      <div class="ds">武器已升滿，改成電路插槽 +1（目前 ${Game.chain.length} 格，最多 ${CFG.MAX_SLOTS} 格）。</div>
      <button data-act="slot" data-arg="armory">選擇</button></div>` : '';
    if (stage === 2) {
      body = `<div class="sub" style="text-align:center;margin:20px 0">武器已經升滿兩段。</div>
        <div class="cards">${slotCard}</div>
        <div class="row" style="justify-content:center">
          <button class="big" data-act="armorybonus">改領 ◆ +${CFG.ARMORY_BONUS.credits}、HP +${CFG.ARMORY_BONUS.hp}</button></div>`;
    } else {
      const opts = stage === 0
        ? Object.entries(W.paths).map(([k, P]) => card(k, P, W.color)).join('')
        : W.paths[st.path].next.map((n, i) => card(i, n, W.color)).join('');
      body = `<div class="cards">${opts}</div>`;
    }
    this.show(`<div class="scr">
      <div class="between"><div><h2 style="color:#ff9f1c">⚒ 軍械台　${stage < 2 ? `第 ${stage + 1} 段升級` : ''}</h2>
        <div class="sub">目前武器：<b style="color:${W.color}">${weaponTitle(st)}</b></div></div>
        ${this.status()}</div>${body}</div>`);
  },

  blackhole() {
    const B = Game.bh, owned = Game.ownedFusable();
    let body;
    if (B.result && B.fusing) {
      body = `<div class="bh-core fusing"></div><div class="result" style="color:#b388ff">晶片正在被吞噬……</div>`;
    } else if (B.result) {
      const R = B.result;
      body = `<div class="result" style="color:${R.ok ? '#e0aaff' : '#8a8f98'}">
          ${R.ok ? '✺ 融合成功！誕生奇異點超載晶片' : '✖ 融合失敗……只剩下一塊廢鐵'}</div>
        <div class="cards">${chipCard(R.id)}</div>
        <div class="sub" style="text-align:center">結果已放在原本第一個素材的位置（${R.where}）。${R.ok ? '' : '廢鐵會卡住插槽，只能在補給站拆除。'}</div>
        <div class="row" style="justify-content:center;margin-top:14px"><button class="big" data-act="leave">返回航圖</button></div>`;
    } else {
      const cards = owned.map(o => {
        const on = B.sel.includes(o.key);
        return chipCard(o.id, `<div class="ty">位置：${o.arr === Game.chain ? '電路第 ' + (o.i + 1) + ' 格' : '倉庫第 ' + (o.i + 1) + ' 格'}</div>
          <button data-act="bhpick" data-arg="${o.key}" ${!on && B.sel.length >= 2 ? 'disabled' : ''}>${on ? '已選取（點擊取消）' : '選為素材'}</button>`)
          .replace('class="card', `class="card${on ? ' picked' : ''}`);
      }).join('');
      body = `<div class="bh-core"></div>
        <div class="sub" style="text-align:center">選 2 個晶片投入黑洞：<b style="color:#e0aaff">50% 融合成奇異點</b>（兩個效果合進一格，再加一個超載詞綴），
          <b style="color:#8a8f98">50% 變成廢鐵</b>卡住插槽。連結器與廢鐵不能投入。</div>
        <div class="cards">${cards || '<div class="sub">目前沒有可投入的晶片。</div>'}</div>
        <div class="row" style="justify-content:center">
          <button class="big" data-act="bhfuse" ${B.sel.length === 2 ? '' : 'disabled'}>投入黑洞（${B.sel.length} / 2）</button>
          <button data-act="leave">不冒險，離開</button></div>`;
    }
    this.show(`<div class="scr">
      <div class="between"><div><h2 style="color:#b388ff">◐ 黑洞事件</h2>
        <div class="sub">高風險、高回報的晶片融合。</div></div>${this.status()}</div>${body}</div>`);
  },

  title() {
    this.show(`<div class="scr title-wrap">
      <h1>星環電路</h1><div class="en">CIRCUIT ROGUE</div>
      <div class="sub">5 把武器 × 各 6 種最終型態 · 3 艘飛船 · 電路構築 · 黑洞融合 · 三星區遠征＋無盡模式</div>
      <div class="row">
        <button class="big" data-act="select" data-arg="run">開始遠征</button>
        <button class="big" data-act="select" data-arg="sandbox">沙盒模式</button>
        <button class="big" data-act="coop" style="border-color:#ff9dbd;color:#ff9dbd">👥 雙人連線（測試）</button>
      </div>
      <div class="row"><button data-act="codex">📖 電路總覽</button>
        <button data-act="records">📜 遊玩紀錄</button>
        <button data-act="music">${Music.on ? '🎵 音樂開' : '🎵 音樂關'}</button>
        <button data-act="mute">${SFX.muted ? '🔇 音效關' : '🔊 音效開'}</button></div>
      <div class="keys">電腦：WASD 移動　·　滑鼠左鍵 射擊　·　Space / 右鍵 衝刺（無敵）　·　Tab 隨時編輯電路（暫停）　·　M 靜音<br>
      手機：自動攻擊時任意位置拖曳移動；關閉自動攻擊後，左半邊移動、右半邊瞄準射擊　·　「衝刺」「電路」「自動」按鈕　·　建議橫向遊玩</div>
      <div class="ver">版本 ${CFG.VERSION}</div>
    </div>`);
  },

  map(toast = '') {
    const layers = Game.map, LN = layers.length, reach = Game.reachable();
    const pos = n => ({ x: 6 + n.L * 88 / (LN - 1), y: (n.k + 1) / (n.n + 1) * 100 });
    let lines = '', nodes = '';
    for (const row of layers) for (const n of row) {
      const a = pos(n);
      for (const id of n.next) {
        const m = Game.nodeById(id), b = pos(m);
        const walked = Game.visited.includes(n.id) && Game.visited.includes(m.id);
        lines += `<line x1="${a.x}%" y1="${a.y}%" x2="${b.x}%" y2="${b.y}%" stroke="${walked ? '#4cc9f0' : '#26336a'}" stroke-width="${walked ? 3 : 2}"/>`;
      }
      const meta = NODE_META[n.type];
      const cls = ['node', reach.includes(n) && 'reach', Game.visited.includes(n.id) && 'visited', Game.node === n && 'current']
        .filter(Boolean).join(' ');
      nodes += `<button class="${cls}" ${reach.includes(n) ? `data-act="node" data-arg="${n.id}"` : ''} style="left:${a.x}%;top:${a.y}%;color:${meta.color};border-color:${meta.color}"
        title="${meta.label}：${meta.desc()}">${meta.icon}<small>${meta.label}</small></button>`;
    }
    // 節點介紹：列出這張圖上有出現的節點種類
    const types = Object.keys(NODE_META).filter(t => layers.flat().some(n => n.type === t));
    const legend = types.map(t => { const M = NODE_META[t];
      return `<div class="nleg"><span class="nleg-ic" style="color:${M.color};border-color:${M.color}">${M.icon}</span><div><b style="color:${M.color}">${M.label}</b>　${M.desc()}</div></div>`; }).join('');
    this.show(`<div class="scr">
      <div class="between"><div><h2>${Game.isEndless() ? `無盡模式 · 星區 ${Game.sector}` : `星區 ${Game.sector} / ${CFG.CAMPAIGN_SECTORS}`} · 航圖</h2>
        <div class="sub">選擇下一個發光的節點。最右側是守關旗艦：<b style="color:${ENEMY_TYPES[Game.bossId].color}">♛ ${ENEMY_TYPES[Game.bossId].name}</b></div></div>${this.status()}</div>
      <div class="map"><svg>${lines}</svg>${nodes}</div>
      <div class="toast">${toast}</div>
      <details class="nlegs" open><summary>節點介紹</summary><div class="nleg-grid">${legend}</div></details></div>`);
  },

  reward() {
    const R = Game.reward, full = !Game.inventory.includes(null);
    const cards = R.options.map(id => {
      const t = Game.mergeTarget(id), ok = Game.canAcquire(id);
      const label = t ? `選擇（合成 Lv${levelOf(t.arr[t.i]) + 1}）` : ok ? '選擇' : '倉庫已滿';
      return chipCard(id, `<button ${ok ? '' : 'disabled'} data-act="reward" data-arg="${id}">${label}</button>`);
    }).join('') + (R.slot ? `<div class="card" style="border-color:#2ee6a6">
      <div class="ty" style="color:#2ee6a6">⚡ 電路擴充</div><div class="ttl">插槽 +1</div>
      <div class="ds">電路多一格（目前 ${Game.chain.length} 格，最多 ${CFG.MAX_SLOTS} 格）。適合晶片流。</div>
      <button data-act="slot" data-arg="reward">選擇</button></div>` : '');
    this.show(`<div class="scr">
      <div class="between"><div><h2>${R.kind === 'elite' ? '☠ 精英擊破：軍規複合晶片' : '⚔ 戰鬥勝利：選擇 1 個晶片'}</h2>
        <div class="sub">${R.bonus ? `額外獎勵 ◆ +${R.bonus}　` : ''}獲得的晶片會放入倉庫，按 Tab 裝上電路。</div></div>${this.status()}</div>
      <div class="cards">${cards}</div>
      <div class="row" style="justify-content:center">
        ${full ? '<span class="sub">倉庫已滿：按 Tab 整理，把晶片拖到「回收」可換成晶體。</span>' : ''}
        <button data-act="reward" data-arg="">跳過（◆ +10）</button></div></div>`);
  },

  shop(toast = '') {
    const full = !Game.inventory.includes(null);  // 補給站不賣武器升級；補血每間限 1 次
    const cards = Game.shop.items.map((it, i) => {
      const t = !it.sold && Game.mergeTarget(it.id), can = Game.canAcquire(it.id);
      const ok = !it.sold && Game.credits >= it.price && can;
      const label = it.sold ? '已售出' : !can ? '倉庫已滿'
        : `購買 ◆ ${it.price}${t ? `（合成 Lv${levelOf(t.arr[t.i]) + 1}）` : ''}`;
      return chipCard(it.id, `<button ${ok ? '' : 'disabled'} data-act="buy" data-arg="${i}">${label}</button>`)
        .replace('class="card', `class="card${it.sold ? ' sold' : ''}`);
    }).join('');
    this.show(`<div class="scr">
      <div class="between"><div><h2>◆ 補給站</h2><div class="sub">晶片會放入倉庫。不要的晶片可在電路編輯器拖到「回收」換成晶體。</div></div>${this.status()}</div>
      <div class="cards">${cards}</div>
      <div class="row" style="justify-content:center">
        ${Game.shop.healed ? '<button disabled>已補血</button>'
          : `<button ${Game.credits >= CFG.SHOP_REPAIR.price && Game.player.hp < Game.player.maxHp ? '' : 'disabled'} data-act="heal">✚ 補血 HP +${CFG.SHOP_REPAIR.hp}（◆ ${CFG.SHOP_REPAIR.price}，限 1 次）</button>`}
        ${Game.findScrap() ? `<button ${Game.credits >= CFG.SCRAP_REMOVE ? '' : 'disabled'} data-act="scrap">拆除 1 塊廢鐵（◆ ${CFG.SCRAP_REMOVE}）</button>` : ''}
        ${!Game.shop.slotBought && Game.chain.length < CFG.MAX_SLOTS
          ? `<button ${Game.credits >= CFG.SHOP_SLOT ? '' : 'disabled'} data-act="slot" data-arg="shop">⚡ 電路擴充 插槽 +1（◆ ${CFG.SHOP_SLOT}，每間限 1 次）</button>` : ''}
        <button data-act="leave">離開補給站</button></div>
      <div class="toast" style="text-align:center">${toast}</div></div>`);
  },

  // 結算：本局傷害總計（依來源拆開）＋ 擊殺、最高單發、戰鬥時間、平均 DPS
  runSummary() {
    const R = Game.runStats;
    if (!R) return '';
    const total = Object.values(R.dmg).reduce((a, b) => a + b, 0);
    const fmt = n => Math.round(n).toLocaleString('zh-TW');
    const mm = Math.floor(R.time / 60), ss = Math.floor(R.time % 60);
    const rows = DMG_SOURCES.filter(([k]) => R.dmg[k] > 0).sort((a, b) => R.dmg[b[0]] - R.dmg[a[0]]).map(([k, label, color]) => {
      const pct = total ? R.dmg[k] / total * 100 : 0;
      return `<div class="sum-lab"><i style="background:${color}"></i>${label}</div>
        <div class="sum-track"><div style="width:${pct.toFixed(1)}%;background:${color}"></div></div>
        <div class="sum-val">${fmt(R.dmg[k])}<span>${pct.toFixed(0)}%</span></div>`;
    }).join('');
    const tile = (k, v) => `<div class="sum-tile"><span>${k}</span><b>${v}</b></div>`;
    return `<div class="summary">
      <div class="sum-head"><span>本局傷害總計</span><b>${fmt(total)}</b></div>
      ${rows ? `<div class="sum-rows">${rows}</div>` : '<div class="sub">這一局還沒有造成傷害。</div>'}
      <div class="sum-tiles">${tile('擊殺', fmt(R.kills))}${tile('最高單發', fmt(R.maxHit))}
        ${tile('戰鬥時間', `${mm}:${String(ss).padStart(2, '0')}`)}${tile('平均 DPS', R.time > 0 ? fmt(total / R.time) : '—')}</div>
      <div class="sum-note">武器：${weaponTitle(Game.weapon)}　·　飛船：${SHIPS[Game.shipId].name}</div></div>`;
  },

  dead() {
    const run = Game.mode === 'run';
    if (Game.mode === 'coop') {
      this.show(`<div class="scr title-wrap">
        <h1 style="color:#ff4d6d;text-shadow:0 0 18px #ff4d6d">雙機全毀</h1>
        <div class="sub">兩人一起撐到第 ${Game.combat.wave} 波 · 共用晶體 ${Game.credits}<br>
          <span style="color:#6a79ad">這一局已存入「遊玩紀錄」（含連線延遲數據）</span></div>
        <div class="row">${Net.linked ? '<button class="big" data-act="netroom">回到房間</button>' : '<span class="sub" style="color:#ff4d6d">隊友已離線</span>'}
          <button data-act="title">離開房間</button></div>
        <div class="row" style="margin-top:0"><button data-act="copyrun">📋 複製這局紀錄</button><button data-act="records">📜 所有遊玩紀錄</button></div>
        <div id="copyBox"></div></div>`);
      return;
    }
    this.show(`<div class="scr title-wrap">
      <h1 style="color:#ff4d6d;text-shadow:0 0 18px #ff4d6d">飛船已毀</h1>
      <div class="sub">${run ? Game.buildRecord('dead').where : `抵達第 ${Game.combat.wave} 波`} · 剩餘晶體 ${Game.credits}
        ${run && Game.lastHit ? `<br>擊毀原因：${Game.lastHit}` : ''}${run ? '<br><span style="color:#6a79ad">這一局已存入「遊玩紀錄」</span>' : ''}</div>
      ${this.runSummary()}
      <div class="row"><button class="big" data-act="run" data-arg="${Game.mode}">重新開始 (R)</button>
      <button class="big" data-act="title">回到標題</button></div>
