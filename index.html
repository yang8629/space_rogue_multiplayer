<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星環電路 雙人版</title>
<style>
  /* 單一深色霓虹世界：刻意不做淺色主題，所有顏色都明確指定 */
  :root { color-scheme: dark; background: #05060f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060f; color: #dfe7ff;
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; }
  /* 只有遊戲操作的部分禁止選取（避免手機長按誤觸）；說明文字都可以選取、複製 */
  canvas, button, .chip, .slot, .node, #touchUI { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body { position: relative; }
  canvas { display: block; cursor: crosshair; touch-action: none; position: absolute; inset: 0; }
  button { background: #13204a; color: #cfe8ff; border: 1px solid #2f4a9a; border-radius: 6px; padding: 5px 12px;
    cursor: pointer; font-size: 12px; font-family: inherit; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid #4cc9f0; outline-offset: 2px; }
  button:hover:not(:disabled) { background: #1c2f68; }
  button:disabled { opacity: .4; cursor: default; }
  button.big { font-size: 16px; padding: 10px 28px; border-radius: 8px; }
  .hidden { display: none !important; }

  /* ===== 通用畫面（標題 / 航圖 / 獎勵 / 商店 / 結算） ===== */
  #screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(3, 5, 15, .55); }
  .scr { width: 100%; max-width: 1000px; max-height: 94vh; overflow: auto; background: #0b1024; border: 1px solid #2a3a7a;
    border-radius: 12px; padding: 22px 26px; box-shadow: 0 0 40px rgba(76, 201, 240, .15); }
  .scr h1 { font-size: 26px; color: #bdf0ff; letter-spacing: 3px; text-shadow: 0 0 18px #4cc9f0; }
  .scr h2 { font-size: 20px; color: #4cc9f0; letter-spacing: 2px; }
  .scr .sub { color: #8fa3d9; font-size: 13px; margin-top: 6px; line-height: 1.7; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .pill { font-size: 13px; background: #070b1a; border-radius: 20px; padding: 4px 12px; color: #cfe8ff; }
  .pill.gold { color: #ffd166; }
  .title-wrap { text-align: center; padding: 30px 10px; }
  .title-wrap h1 { font-size: 54px; }
  .title-wrap .en { color: #4cc9f0; letter-spacing: 8px; margin: 6px 0 24px; }
  .title-wrap .row { justify-content: center; margin: 26px 0 18px; }
  .keys { font-size: 12px; color: #6a79ad; line-height: 1.9; }
  .ver { font-size: 11px; color: #4a5886; letter-spacing: .05em; font-variant-numeric: tabular-nums; }

  .map { position: relative; width: 100%; height: 440px; margin-top: 14px; background: #070b1a; border-radius: 10px; }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .node { position: absolute; width: 50px; height: 50px; border-radius: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 20px;
    background: #0d1433; border: 2px solid; cursor: default; opacity: .35; padding: 0; }
  .node small { font-size: 9px; margin-top: -2px; }
  .node.reach { opacity: 1; cursor: pointer; animation: pulse 1.2s infinite; }
  .node.visited { opacity: .9; background: #1a2550; }
  .node.current { opacity: 1; box-shadow: 0 0 18px currentColor; }
  @keyframes pulse { 50% { box-shadow: 0 0 16px currentColor; } }
  .toast { margin-top: 10px; color: #9dff6b; font-size: 13px; min-height: 18px; }
  .nlegs { margin-top: 8px; font-size: 12px; color: #c9d4ff; }
  .nlegs summary { cursor: pointer; color: #8fa3d9; font-size: 13px; margin-bottom: 6px; }
  .nleg-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; }
  .nleg { display: flex; gap: 8px; align-items: flex-start; line-height: 1.5; background: #070b1a; border-radius: 8px; padding: 6px 8px; }
  .nleg-ic { flex: none; width: 24px; height: 24px; border: 1.5px solid; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  @media (max-width: 700px) { .nleg-grid { grid-template-columns: 1fr; } }

  .cards { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin: 20px 0; }
  .card { width: 210px; background: #070b1a; border-radius: 10px; padding: 14px; border: 1px solid #22305e;
    display: flex; flex-direction: column; gap: 8px; }
  .card .ttl { font-weight: 700; font-size: 15px; }
  .card .ty { font-size: 11px; opacity: .8; }
  .card .ds { font-size: 12px; color: #c9d4ff; line-height: 1.6; flex: 1; }
  .card .ps { font-size: 11px; color: #2ee6a6; }
  .card button { width: 100%; padding: 7px; }
  .card.sold { opacity: .35; }

  /* ===== 電路編輯器 ===== */
  /* 靠上對齊：說明文字長短改變面板高度時，上方的電路不會跟著跳動 */
  #editor { position: fixed; inset: 0; background: rgba(3, 5, 15, .82); display: flex;
    align-items: flex-start; justify-content: center; padding-top: 2.5vh; backdrop-filter: blur(3px); z-index: 10; }
  .etabs { display: flex; gap: 6px; margin-top: 10px; border-bottom: 1px solid #22305e; }
  .etabs button { border-radius: 8px 8px 0 0; border-bottom: none; }
  .etabs button.on { background: #1a2a5e; color: #fff; border-color: #4cc9f0; }
  .dmg-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  .dmg-table th { text-align: right; color: #8fa3d9; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid #22305e; }
  .dmg-table th:first-child, .dmg-table td:first-child { text-align: left; }
  .dmg-table td { padding: 6px 8px; border-bottom: 1px solid #141c3a; text-align: right; color: #eef2ff;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dmg-table td:first-child { white-space: normal; }
  .dmg-table .bar { height: 6px; background: #111a3a; border-radius: 3px; margin-top: 4px; }
  .dmg-table .bar div { height: 6px; border-radius: 3px; min-width: 1px; }
  .dmg-table .pct { color: #6a79ad; margin-left: 6px; display: inline-block; width: 34px; }
  .rec-list { display: grid; gap: 8px; margin-top: 12px; }
  .rec { background: #070b1a; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #c9d4ff; line-height: 1.6; text-align: left; }
  .rec b { color: #fff; }
  .rec-copy { width: 100%; height: 120px; margin-top: 10px; background: #070b1a; color: #c9d4ff; border: 1px solid #2a3a7a;
    border-radius: 8px; font: 11px/1.4 monospace; padding: 8px; }
  .panel { width: 100%; max-width: 1020px; max-height: 95vh; overflow: auto; background: #0b1024;
    border: 1px solid #2a3a7a; border-radius: 12px; padding: 18px 22px; box-shadow: 0 0 40px rgba(76, 201, 240, .15); }
  .panel h2 { color: #4cc9f0; letter-spacing: 2px; font-size: 19px; }
  .panel h3 { font-size: 13px; color: #8fa3d9; margin: 14px 0 8px; font-weight: 600; }
  .chain, .inv { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 14px 12px;
    background: #070b1a; border-radius: 10px; border: 1px dashed #22305e; }
  .inv { gap: 10px; }
  .slot { width: 108px; height: 76px; border: 2px dashed #2f3f78; border-radius: 8px; display: flex;
    align-items: center; justify-content: center; position: relative; background: #0a1030; }
  .inv .slot { border-color: #24506a; background: #08151f; }
  .slot.seg1 { background: #1f0d2a; border-color: #6b2d5c; }
  .slot.seg2 { background: #2a0d22; border-color: #8a2d55; }
  .slot.seg3 { background: #33101c; border-color: #a8304d; }
  .slot.over { border-color: #4cc9f0 !important; background: #10224a !important; }
  .slot .idx { position: absolute; top: -9px; left: 6px; font-size: 10px; color: #6a79ad; background: #070b1a; padding: 0 4px; white-space: nowrap; }
  .slot .empty { font-size: 11px; color: #3e4c80; }
  .arrow { color: #4c5a8f; font-size: 18px; width: 22px; text-align: center; }
  .arrow.trig { color: #ff6b9d; font-size: 11px; width: 38px; line-height: 1.1; }
  .chip { width: 98px; height: 64px; border-radius: 7px; padding: 5px 7px; cursor: grab; display: flex;
    flex-direction: column; justify-content: space-between; border: 1px solid; font-size: 13px; background: #0d1433; }
  .chip .top { display: flex; justify-content: space-between; font-size: 10px; opacity: .85; }
  .chip .nm { font-weight: 600; font-size: 13px; line-height: 1.15; }
  .chip.idle { opacity: .4; filter: grayscale(.7); }
  .t-source { border-color: #4cc9f0; color: #bdf0ff; box-shadow: inset 0 0 14px rgba(76, 201, 240, .22); }
  .t-mod { border-color: #b388ff; color: #e3d4ff; box-shadow: inset 0 0 14px rgba(179, 136, 255, .22); }
  .t-amp { border-color: #ffd166; color: #fff0c7; box-shadow: inset 0 0 14px rgba(255, 209, 102, .2); }
  .t-trigger { border-color: #ff6b9d; color: #ffd3e2; box-shadow: inset 0 0 14px rgba(255, 107, 157, .25); }
  .t-link { border-color: #2ee6a6; color: #c8ffe9; box-shadow: inset 0 0 14px rgba(46, 230, 166, .2); }
  .t-composite { border-color: #ff9f1c; color: #ffe2b8; background: linear-gradient(135deg, #2a1a08, #0d1433);
    box-shadow: inset 0 0 16px rgba(255, 159, 28, .35); }
  .t-singularity { border-color: #e0aaff; color: #f3e6ff; background: radial-gradient(circle at 30% 25%, #3a1d5c, #0d1433 70%);
    box-shadow: inset 0 0 18px rgba(224, 170, 255, .4); }
  .t-scrap { border-color: #555b66; color: #9aa0aa; cursor: not-allowed;
    background: repeating-linear-gradient(45deg, #1a1c22 0 6px, #23262e 6px 12px); }
  .card.t-source, .card.t-mod, .card.t-amp, .card.t-trigger, .card.t-link, .card.t-composite,
  .card.t-singularity, .card.t-scrap { border-width: 1px; border-style: solid; }
  .card.picked { outline: 2px solid #e0aaff; outline-offset: 3px; }
  .bh-core { width: 120px; height: 120px; margin: 8px auto 0; border-radius: 50%;
    background: radial-gradient(circle, #000 38%, #3a1d5c 55%, #b388ff 62%, transparent 72%);
    box-shadow: 0 0 40px #7b2cbf; animation: bhspin 4s linear infinite; }
  .bh-core.fusing { animation: bhspin .35s linear infinite; }
  @keyframes bhspin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .bh-core, .node.reach { animation: none; } }
  .result { text-align: center; font-size: 18px; margin-top: 14px; font-weight: 700; }
  .dock { display: flex; gap: 12px; margin-top: 12px; align-items: stretch; }
  .recycle { width: 150px; border: 2px dashed #6b2d2d; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; text-align: center; font-size: 12px; color: #ff8a8a; padding: 8px; background: #140a10; }
  .recycle.over { border-color: #ff6b6b; background: #2a0f16; }
  .library { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; background: #070b1a; border-radius: 10px; }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: #070b1a; border-radius: 8px; padding: 8px 10px; font-size: 11px; color: #8fa3d9; }
  .stat b { display: block; font-size: 18px; color: #fff; margin-top: 2px; }
  .layers { margin-top: 8px; font-size: 12px; color: #ff9dbd; min-height: 16px; }
  .passives { font-size: 12px; color: #2ee6a6; margin-top: 8px; min-height: 16px; }
  .info { margin-top: 12px; height: 118px; overflow-y: auto; font-size: 13px; color: #c9d4ff; background: #070b1a;
    border-radius: 8px; padding: 10px 12px; line-height: 1.6; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .bar span { font-size: 12px; color: #6a79ad; margin-right: 4px; }
  .hint { font-size: 12px; color: #64749f; margin-top: 10px; }
  .chip.sel { outline: 2px solid #fff; outline-offset: 2px; }
  .selbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  /* ===== 觸控操作 ===== */
  #touchUI { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #touchUI button { pointer-events: auto; position: absolute; border-radius: 50%; font-weight: 700;
    background: rgba(19, 32, 74, .6); border: 2px solid rgba(76, 201, 240, .7); color: #bdf0ff; }
  #tDash { width: 76px; height: 76px; font-size: 14px;
    right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
  #tEdit { width: 58px; height: 58px; font-size: 12px; border-color: rgba(255, 209, 102, .7) !important; color: #ffe7a8 !important;
    right: calc(18px + env(safe-area-inset-right, 0px)); top: calc(140px + env(safe-area-inset-top, 0px)); }
  #tAuto { width: 58px; height: 58px; font-size: 12px; line-height: 1.2; border-color: rgba(157, 255, 107, .8) !important; color: #d4ffbf !important;
    right: calc(18px + env(safe-area-inset-right, 0px)); top: calc(208px + env(safe-area-inset-top, 0px)); }
  #tAuto.off { border-color: rgba(106, 121, 173, .7) !important; color: #8fa3d9 !important; background: rgba(10, 14, 30, .6) !important; }

  /* ===== 電路總覽 ===== */
  #codex { position: fixed; inset: 0; background: rgba(3, 5, 15, .88); display: flex;
    align-items: center; justify-content: center; backdrop-filter: blur(3px); z-index: 20; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
  .tabs button.on { border-color: #4cc9f0; color: #4cc9f0; background: #0f2146; }
  .codex-sec { margin-top: 16px; }
  .codex-sec h3 { margin: 0 0 8px; }
  .rules { display: grid; gap: 8px; font-size: 13px; line-height: 1.7; color: #c9d4ff; }
  .rules > div { background: #070b1a; border-radius: 8px; padding: 10px 12px; }
  .rules b { color: #fff; }
  .tree { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
  .tree > div { background: #070b1a; border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.6; color: #c9d4ff; }
  .tree .leaf { margin-top: 6px; padding: 6px 8px; background: #0b1330; border: 1px solid #1c2748; border-radius: 6px; }
  .tree .wt-stage { font-size: 11px; color: #8fa3d9; letter-spacing: 1px; margin: 8px 0 4px; }
  .tree .wt-stage:first-child { margin-top: 0; }
  .slotrow { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: start; background: #070b1a;
    border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.6; color: #c9d4ff; }
  .slotrow .no { font-size: 11px; color: #6a79ad; font-variant-numeric: tabular-nums; }
  .slotrow.idle { opacity: .5; }
  @media (max-width: 700px) { .tree { grid-template-columns: 1fr; } }

  /* ===== 結算：本局傷害總計 ===== */
  .summary { text-align: left; max-width: 560px; margin: 22px auto 4px; background: #070b1a; border-radius: 10px; padding: 16px 18px; }
  .sum-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .sum-head span { font-size: 13px; color: #8fa3d9; letter-spacing: 1px; }
  .sum-head b { font-size: 34px; color: #fff; }
  .sum-rows { display: grid; grid-template-columns: minmax(96px, auto) 1fr 92px; gap: 6px 10px; align-items: center; font-size: 12px; }
  .sum-lab { color: #c9d4ff; white-space: nowrap; }
  .sum-lab i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .sum-track { height: 10px; background: #111a3a; border-radius: 0 4px 4px 0; }
  .sum-track div { height: 10px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .sum-val { text-align: right; color: #eef2ff; font-variant-numeric: tabular-nums; }
  .sum-val span { color: #6a79ad; margin-left: 6px; display: inline-block; width: 30px; }
  .sum-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .sum-tile { background: #0d1433; border-radius: 8px; padding: 8px 10px; font-size: 11px; color: #8fa3d9; }
  .sum-tile b { display: block; font-size: 17px; color: #fff; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .sum-note { font-size: 11px; color: #6a79ad; margin-top: 10px; }
  @media (max-width: 700px) { .sum-tiles { grid-template-columns: repeat(2, 1fr); } .sum-rows { grid-template-columns: auto 1fr 84px; } }

  /* ===== 機制檢查 ===== */
  .mech { display: grid; gap: 6px; }
  .mech-row { display: grid; grid-template-columns: 26px minmax(140px, 1.2fr) 1.3fr 1.3fr; gap: 10px; align-items: start;
    background: #070b1a; border-radius: 8px; padding: 8px 12px; font-size: 12px; line-height: 1.55; color: #c9d4ff; }
  .mech-row .st { font-weight: 700; font-size: 14px; }
  .mech-row .st.ok { color: #0ca30c; } .mech-row .st.ng { color: #ff6b6b; }
  .mech-row .ex { color: #8fa3d9; }
  .mech-head { font-size: 11px; color: #6a79ad; background: transparent; padding-top: 0; padding-bottom: 0; }
  @media (max-width: 700px) { .mech-row { grid-template-columns: 22px 1fr; } .mech-row .ex, .mech-row .got { grid-column: 2; } .mech-head { display: none; } }

  /* ===== 數值圖表（深色圖表面、色盲安全配色，已驗證） ===== */
  .viz { --surface: #070b1a; --ink: #eef2ff; --ink-2: #c9d4ff; --muted: #8fa3d9; --grid: #182244; --axis: #2c3a66;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    position: relative; background: var(--surface); border-radius: 10px; padding: 14px 14px 10px; margin-top: 10px; }
  .viz h4 { font-size: 14px; color: var(--ink); margin: 0 0 2px; text-wrap: balance; }
  .viz .cap { font-size: 12px; color: var(--muted); margin-bottom: 8px; line-height: 1.5; }
  .viz svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .viz svg text { font-family: inherit; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin: 4px 0 6px; }
  .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  .viz-tip { position: absolute; pointer-events: none; background: #111a3a; border: 1px solid #2c3a66; border-radius: 8px;
    padding: 8px 10px; font-size: 12px; color: var(--ink-2); line-height: 1.6; min-width: 140px; z-index: 2; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .viz-tip b { color: var(--ink); }
  .viz-tip .v { float: right; margin-left: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .bars { display: grid; grid-template-columns: minmax(120px, 170px) 1fr 44px; gap: 4px 10px; align-items: center; font-size: 12px; }
  .bars .grp { grid-column: 1 / -1; font-size: 12px; font-weight: 700; margin-top: 8px; color: var(--ink); }
  .bars .grp i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .bars .lab { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bars .track { height: 12px; }
  .bars .bfill { height: 12px; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; }
  .bars .bfill:hover { filter: brightness(1.25); }
  .bars .val { color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
  /* 武器升級 DPS：每把武器一張卡，照升級樹排 */
  .wt-card { border: 1px solid #1c2748; border-left: 3px solid var(--wc); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  .wt-head { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
  .wt-head > span:first-child { font-weight: 700; color: var(--ink); }
  .wt-head i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--wc); margin-right: 7px; }
  .wt-head b { color: var(--ink); font-size: 15px; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .wt-paths { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .wt-path { background: #0b1330; border-radius: 8px; padding: 8px 10px 10px; }
  .wt-stage { font-size: 11px; color: var(--muted); letter-spacing: 1px; margin: 8px 0 4px; }
  .wt-stage:first-child { margin-top: 0; }
  .wt-finals { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .wt-finals .wt-node { background: #070b1a; border: 1px solid #1c2748; border-radius: 6px; padding: 6px 8px; }

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const pickN = (arr, n) => [...arr].sort(() => Math.random() - 0.5).slice(0, n);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const angleDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };
const mod = (v, m) => ((v % m) + m) % m;
// 點 (px,py) 到線段 A→B 的最短距離平方：用來判定子彈「整段飛行路徑」有沒有碰到敵人
function segDist2(ax, ay, bx, by, px, py) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1) : 0;
  return dist2(ax + dx * t, ay + dy * t, px, py);
}

// ---------- 增幅相加：每顆子彈記住累積的加成 bonus，傷害 ＝ 基礎 ×（1 ＋ 所有加成的總和） ----------
//   分裂、子彈上限換算、聚焦合併這些「數量」類的變化仍然是相乘，只有增幅類的百分比加成是相加
function addBonus(b, add) {
  const old = b.bonus || 0, nb = old + add;
  return { ...b, bonus: nb, damage: b.damage / Math.max(0.1, 1 + old) * Math.max(0.1, 1 + nb) };
}

// ---------- 晶片傷害歸屬 ----------
//   src：產生這顆子彈的來源（武器、鏡像複製的武器、觸發器的回響）→ 拿「基礎傷害」
//   cr ：加工過這顆子彈的晶片 → 各自記錄 ln(傷害倍率)；多出來的傷害依 ln 倍率比例分給它們
//   射速類晶片（超頻、冷卻管線）的貢獻由 analyzeChain 算成 rateCr，命中時一起分攤
function creditFactor(list, key, f) {
  if (!key || !(f > 0) || Math.abs(Math.log(f)) < 1e-9) return list;
  const lf = Math.log(f);
  for (const b of list) b.cr = Object.assign({}, b.cr, { [key]: ((b.cr && b.cr[key]) || 0) + lf });
  return list;
}
function splitDamage(amount, att, rateCr) {
  const w = {};
  for (const src of [att && att.cr, rateCr]) if (src) for (const k in src) w[k] = (w[k] || 0) + src[k];
  let L = 0;
  for (const k in w) if (w[k] > 0) L += w[k]; else delete w[k];
  const out = {}, base = amount * Math.exp(-L), srcKey = (att && att.src) || 'weapon';
  out[srcKey] = base;
  for (const k in w) out[k] = (out[k] || 0) + (amount - base) * w[k] / L;
  return out;
}

function weaponParams(state) {

    explode: null, burn: null, shards: null, arcs: null, slow: 0, knock: 1, lifesteal: 0, color: W.color }, W.base);
  if (state.path) {
    W.paths[state.path].apply(p);
    if (state.final != null) W.paths[state.path].next[state.final].apply(p);
  }
  return p;
}
function weaponEmit(p, pw) {
  const out = [];
  for (let k = 0; k < p.count; k++) {
    const a = (p.count > 1 ? -p.spread / 2 + p.spread * k / (p.count - 1) : 0) + (p.jitter ? rand(-p.jitter, p.jitter) : 0);
    out.push(shot({ angle: a, speed: p.speed * (p.speedVar ? rand(0.92, 1.08) : 1), damage: p.damage * pw,
      radius: p.radius, pierce: p.pierce, bounce: p.bounce, homing: p.homing, life: p.life, color: p.color, shape: p.shape,
      explode: p.explode, burn: p.burn, shards: p.shards, arcs: p.arcs, slow: p.slow, knock: p.knock, lifesteal: p.lifesteal }));
  }
  return out;
}

  const W = WEAPONS[state.id], P = state.path && W.paths[state.path];

}

// =====================================================================
// PIPELINE — 線性電路執行器（與畫面無關的純邏輯）
//   compileChain: 插槽 → ops（展開複合、鏡像，計算共振倍率）
//   runOps      : 執行 ops，產生子彈清單
// =====================================================================
function compileChain(chain) {
  const ops = [], slotOps = [];
  // 協同處理器用：電路中「其他晶片」的數量（不含武器與廢鐵）
  const chipCount = chain.filter(id => id && id !== 'weapon' && id !== 'scrap').length;
  chain.forEach((id, i) => {
    slotOps[i] = null;
    if (!id) return;
    const def = CHIPS[id];
    let pw = 1;
    for (const j of [i - 1, i + 1])
      if (chain[j] && baseOf(chain[j]) === 'resonator') pw += CFG.RESONANCE * (CHIPS[chain[j]].lvMul || 1);
    pw *= def.lvMul || 1;  // 晶片等級
    if (id === 'mirror') {
      const src = slotOps[i - 1];
      if (src) ops.push(...src.map(o => ({ id: o.id, pw: Math.max(pw, o.pw), slot: i, n: o.n, key: 'mirror' })));
      return;
    }
    if (def.type === 'link' || def.type === 'scrap') return;
    // key：傷害統計用的晶片（複合／奇異點的每個組成都算在那一格的晶片上）
    const mine = (def.combo || [id]).map(cid => ({ id: cid, pw, slot: i, n: chipCount - 1, key: baseOf(id) }));
    slotOps[i] = mine;
    ops.push(...mine);
  });
  return ops;
}

function capShots(list) {
  const n = list.length, cap = CFG.MAX_SHOTS_PER_FIRE, ratio = n / cap, out = [];
  for (let k = 0; k < cap; k++) {
    const b = list[Math.floor(k * n / cap)];
    out.push({ ...b, damage: b.damage * ratio });  // 超出的數量轉換為傷害
  }
  return out;
}

function runOps(ops, depth) {
  let list = [];
  for (let i = 0; i < ops.length; i++) {
    const o = ops[i], def = CHIPS[o.id];
    if (def.type === 'source') {
      const src = o.key || 'weapon';
      list.push(...def.emit(o.pw).map(b => Object.assign(b, { src, cr: null })));
    } else if (def.type === 'trigger') {
      if (list.length && depth < CFG.MAX_TRIGGER_DEPTH) {
        // 子電路 = 武器回響（50% 傷害）＋ 觸發器右側的晶片；回響的基礎傷害算在觸發器上
        const payload = [{ id: 'echo', pw: o.pw, slot: o.slot, key: o.key }, ...ops.slice(i + 1)];
        for (const s of list) s.payload = payload;
      }
      break;  // 觸發器之後的晶片不在這一層執行
    } else if (list.length) {
      let before = 0, after = 0;
      for (const b of list) before += b.damage;
      list = def.apply(list, o.pw, o);
      for (const b of list) after += b.damage;
      if (before > 0) creditFactor(list, o.key, after / before);
    }
    if (list.length > CFG.MAX_SHOTS_PER_FIRE) list = capShots(list);
  }
  return list;
}

// 能量負載 → 射速倍率（1 = 不變；5 點能量 = 0.75，也就是射速 -25%）
const heatRateMul = heat => Math.max(CFG.HEAT_RATE_FLOOR, 1 - heat * CFG.HEAT_RATE);
// 一格晶片降低的能量負載：冷卻管線本身，或含有冷卻管線的複合晶片／奇異點
const coolOf = id => ((CHIPS[id].cool || 0) + (CHIPS[id].combo || []).reduce((a, c) => a + (CHIPS[c].cool || 0), 0)) * (CHIPS[id].lvMul || 1);

function analyzeChain(chain) {
  let heat = 0, rate = 1;
  for (const id of chain) if (id) heat += CHIPS[id].cost;
  for (const id of chain) if (id) heat -= coolOf(id);  // 冷卻管線
  heat = Math.max(0, heat);
  const ops = compileChain(chain);
  for (const o of ops) if (CHIPS[o.id].rate) rate *= Math.pow(CHIPS[o.id].rate, o.pw);
  const wp = Game.wp;  // 武器決定基礎射擊間隔
  const interval = Math.max(CFG.MIN_INTERVAL, wp.interval / heatRateMul(heat) * rate * wp.rate);
  // 傷害統計：射速類晶片讓每秒傷害變成幾倍，記成 ln 倍率（見 splitDamage）
  const rateCr = {};
  for (const o of ops) if (CHIPS[o.id].rate && o.key)
    rateCr[o.key] = (rateCr[o.key] || 0) - o.pw * Math.log(CHIPS[o.id].rate);
  const coolers = chain.filter(id => id && coolOf(id) > 0);
  if (coolers.length) {
    let raw = 0;
    for (const id of chain) if (id) raw += CHIPS[id].cost;
    const noCool = Math.max(CFG.MIN_INTERVAL, wp.interval / heatRateMul(raw) * rate * wp.rate);
    const gain = Math.log(noCool / interval), total = coolers.reduce((a, id) => a + coolOf(id), 0);
    if (gain > 0) for (const id of coolers)
      rateCr[baseOf(id)] = (rateCr[baseOf(id)] || 0) + gain * coolOf(id) / total;
  }
  const top = runOps(ops, 0);
  const sum = l => l.reduce((a, b) => a + b.damage, 0);
  // 估算命中效果的額外傷害：爆炸假設多打到 1.5 隻、碎片命中一半
  const effect = b => b.damage +
    (b.explode ? b.damage * b.explode.ratio * 1.5 : 0) +
    (b.shards ? b.damage * b.shards.ratio * b.shards.n * 0.5 : 0) +
    (b.arcs ? b.damage * b.arcs.ratio * b.arcs.n * 0.5 : 0);  // 電弧：假設一半打到別隻、一半打回目標
  const est = top.reduce((a, b) => a + effect(b), 0);
  // 燃燒不會疊加（再次命中只會刷新時間），持續命中時等於每秒多造成「燃燒每秒傷害」
  const burnDps = Math.max(0, ...top.map(b => b.burn ? b.burn.dps : 0));
  const layers = [];
  let carrier = top.find(s => s.payload);
  while (carrier) {
    const sub = runOps(carrier.payload, layers.length + 1);
    layers.push({ count: sub.length, dmg: sum(sub) });
    carrier = sub.find(s => s.payload);
  }
  return { ops, heat, interval, rps: 1 / interval, count: top.length, dmg: sum(top), dpsEst: est / interval + burnDps, layers, rateCr };
}

function computePassives(inventory) {
  const P = { speed: 0, armor: 0, maxHp: 0, dashCd: 0, magnet: 0, greed: 0 };
  for (const id of inventory) {
    const s = id && CHIPS[id].stored;
    if (s) for (const k in s) P[k] += s[k];
  }
  P.armor = Math.min(0.6, P.armor);
  P.dashCd = Math.min(0.6, P.dashCd);
  return P;
}

// 生成後檢查保底條件，不符合就重新生成（保底規則之間可能互相覆蓋）
//   精英、黑洞、補給站至少各一；軍械台整張圖剛好一個（第 2～5 層）；每個精英的下一步至少有一條路通維修站；
//   維修站、補給站都不會連著出現（沒有「維修站 → 維修站」「補給站 → 補給站」的路線）
function mapOk(m) {
  const has = (from, to, type) => m.slice(from, to).flat().some(n => n.type === type);
  const all = m.flat(), byId = id => all.find(n => n.id === id);
  const armories = all.filter(n => n.type === 'armory');
  return has(2, 4, 'elite') && has(2, 5, 'blackhole') && has(1, 5, 'shop') && m[m.length - 2].every(n => n.type === 'shop') &&
    armories.length === 1 && armories[0].L >= 1 && armories[0].L <= 4 &&
    all.filter(n => n.type === 'elite').every(n => n.next.some(id => byId(id).type === 'repair')) &&
    !all.some(n => ['repair', 'shop'].includes(n.type) && n.next.some(id => byId(id).type === n.type));
}
function genMap() {
  let m;
  for (let i = 0; i < 200; i++) {
    m = genMapOnce();
    if (mapOk(m)) break;
  }
  return m;
}
function genMapOnce() {
  const LAYERS = 7, layers = [];
  for (let L = 0; L < LAYERS; L++) {
    const n = L === LAYERS - 1 ? 1 : L === 0 ? 2 : randInt(2, 3);
    const row = [];
    for (let k = 0; k < n; k++) row.push({ id: L + '-' + k, L, k, n, type: 'combat', next: [] });
    layers.push(row);
  }
  for (let L = 2; L < LAYERS - 2; L++) for (const nd of layers[L]) {
    const r = Math.random();
    nd.type = r < 0.2 ? 'elite' : r < 0.32 ? 'shop' : r < 0.4 ? 'repair' : r < 0.52 ? 'blackhole' : 'combat';
    // 精英只放第 3～4 層：精英後面要接維修站，而第 6 層（王前）全部是補給站
    if (nd.type === 'elite' && L > 3) nd.type = 'combat';
  }
  if (Math.random() < 0.5) pick(layers[1]).type = 'shop';
  // 保底：優先把「戰鬥」節點改成缺少的類型
  const ensure = (nodes, type) => {
    if (nodes.some(n => n.type === type)) return;
    const cands = nodes.filter(n => n.type === 'combat');
    pick(cands.length ? cands : nodes).type = type;
  };
  const mid = layers.slice(2, 5).flat();
  ensure(layers.slice(2, 4).flat(), 'elite');
  ensure(mid, 'blackhole');
  ensure(layers.slice(1, 5).flat(), 'shop');
  // 軍械台整張圖只有一個，隨機放在第 2～5 層的戰鬥節點上
  const armCands = layers.slice(1, 5).flat().filter(n => n.type === 'combat');
  if (armCands.length) pick(armCands).type = 'armory';
  layers[LAYERS - 2].forEach(nd => nd.type = 'shop');  // 王關前一層全部是補給站
  layers[LAYERS - 1][0].type = 'boss';

  const rel = n => (n.k + 0.5) / n.n;
  const link = (a, b) => { if (!a.next.includes(b.id)) a.next.push(b.id); };
  for (let L = 0; L < LAYERS - 1; L++) {
    const A = layers[L], B = layers[L + 1];
    for (const a of A) {
      const s = [...B].sort((x, y) => Math.abs(rel(x) - rel(a)) - Math.abs(rel(y) - rel(a)));
      link(a, s[0]);
      if (s[1] && Math.random() < 0.45) link(a, s[1]);
    }
    for (const b of B) if (!A.some(a => a.next.includes(b.id)))
      link([...A].sort((x, y) => Math.abs(rel(x) - rel(b)) - Math.abs(rel(y) - rel(b)))[0], b);
  }
  // 精英之後：下一步至少有一條路通維修站（優先把戰鬥節點改掉，其次補給站）
  const byId = id => layers.flat().find(n => n.id === id);
  for (const e of layers.flat().filter(n => n.type === 'elite')) {
    const next = e.next.map(byId);
    if (next.some(n => n.type === 'repair')) continue;
    // 優先挑前後都沒有維修站的節點，避免造成維修站連著出現
    const parents = n => layers.flat().filter(p => p.next.includes(n.id));
    const lonely = n => ![...parents(n), ...n.next.map(byId)].some(x => x.type === 'repair');
    const cands = [...next.filter(n => n.type === 'combat'), ...next.filter(n => n.type === 'shop')];
    const cand = cands.find(lonely) || cands[0];
    if (cand) cand.type = 'repair';
  }
  // 維修站不連著出現：「維修站 → 維修站」時，把不是精英保底的那一個改掉
  const needed = n => layers.flat().some(p => p.type === 'elite' && p.next.includes(n.id));
  for (const a of layers.flat()) {
    if (a.type !== 'repair') continue;
    for (const b of a.next.map(byId)) {
      if (b.type !== 'repair') continue;
      if (!needed(a)) { a.type = 'combat'; break; }
      if (!needed(b)) b.type = 'combat';
    }
  }
  // 補給站也不連著出現：「補給站 → 補給站」時把前面那一個改成戰鬥（第 6 層的補給站保留）
  for (const a of layers.flat()) {
    if (a.type === 'shop' && a.next.some(id => byId(id).type === 'shop')) a.type = 'combat';
  }
  return layers;
}

const Input = { keys: new Set(), mx: 0, my: 0, down: false, dash: false,
  touch: false,                    // 偵測到觸控後切換為雙搖桿操作
  autoFire: true,                  // 手機自動攻擊（可切換，記在瀏覽器）

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (Codex.isOpen) {  // 總覽開著時：Esc 關閉，其他按鍵不影響遊戲
    if (k === 'escape') Codex.close();
    if (k === 'tab') e.preventDefault();
    return;
  }
  if (k === 'tab') { e.preventDefault(); if (!e.repeat) Game.toggleEditor(); return; }
  if (k === ' ') { e.preventDefault(); if (Game.state === 'play') Input.dash = true; return; }
  Input.keys.add(k);
  if (k === 'escape' && Game.state === 'editor') Game.toggleEditor();
  if (k === 'enter' && Game.state === 'title') Screen.select('run');
  if (k === 'enter' && Game.state === 'lobby' && document.activeElement && document.activeElement.id === 'netCode') Net.join(document.activeElement.value);
  if (k === 'r' && Game.state === 'dead' && Game.mode !== 'coop') Screen.restart();
});
addEventListener('keyup', e => Input.keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => { Input.keys.clear(); Input.down = false; });

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const canvasPos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
addEventListener('mousemove', e => { const p = canvasPos(e); Input.mx = p.x; Input.my = p.y; });
canvas.addEventListener('mousedown', e => {
  if (Game.state !== 'play' || Input.touch) return;
  if (e.button === 0) Input.down = true;
  if (e.button === 2) Input.dash = true;
});
addEventListener('mouseup', e => { if (e.button === 0) Input.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ---- 觸控：左半邊移動搖桿、右半邊瞄準射擊（輕觸不拖曳 = 自動瞄準最近敵人） ----
function setTouchMode(on) {
  if (Input.touch === on) return;
  Input.touch = on;
  TouchUI.sync();
}
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') { setTouchMode(false); return; }
  setTouchMode(true);
  if (Game.state !== 'play') return;
  const p = canvasPos(e), stick = { id: e.pointerId, bx: p.x, by: p.y, x: p.x, y: p.y };
  // 自動攻擊開啟時沒有瞄準搖桿：整個畫面都只當移動搖桿
  if (Input.autoFire || p.x < VW / 2) { if (!Input.joy) Input.joy = stick; }
  else if (!Input.aimStick) Input.aimStick = stick;
});
canvas.addEventListener('pointermove', e => {
  const p = canvasPos(e);
  for (const s of [Input.joy, Input.aimStick]) if (s && s.id === e.pointerId) { s.x = p.x; s.y = p.y; }
});
function releasePointer(e) {
  if (Input.joy && Input.joy.id === e.pointerId) Input.joy = null;
  if (Input.aimStick && Input.aimStick.id === e.pointerId) Input.aimStick = null;
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
function stickVec(s, max = 60) {
  const dx = s.x - s.bx, dy = s.y - s.by, l = Math.hypot(dx, dy);
  if (l < 1) return { x: 0, y: 0, len: 0 };
  const m = Math.min(1, l / max);
  return { x: dx / l * m, y: dy / l * m, len: l };
}

const TouchUI = {
  el: document.getElementById('touchUI'),
  init() {
    const dash = document.getElementById('tDash'), edit = document.getElementById('tEdit');
    this.autoBtn = document.getElementById('tAuto');
    try { if (localStorage.getItem('autoFire') === '0') Input.autoFire = false; } catch (e) {}
    dash.addEventListener('pointerdown', e => { e.preventDefault(); if (Game.state === 'play') Input.dash = true; });
    edit.addEventListener('click', () => Game.toggleEditor());
    this.autoBtn.addEventListener('click', () => {
      Input.autoFire = !Input.autoFire;
      if (Input.autoFire) Input.aimStick = null;
      try { localStorage.setItem('autoFire', Input.autoFire ? '1' : '0'); } catch (e) {}
      this.renderAuto();
    });
    this.renderAuto();
  },
  renderAuto() {
    this.autoBtn.innerHTML = `自動<br>${Input.autoFire ? '開' : '關'}`;

};

let VW = 0, VH = 0, DPR = 1, ZOOM = 1, ZW = 0, ZH = 0;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);

// =====================================================================
// SFX — Web Audio 即時合成音效（不需要音檔）
//   瀏覽器規定要使用者互動後才能發聲，所以在第一次點擊或按鍵時 init
//   同一種聲音有最短間隔（gap），避免高射速時變成噪音
// =====================================================================
const SFX = {
  ctx: null, master: null, noise: null, muted: false, last: {},
  VOLUME: 0.35,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : this.VOLUME;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 0.6, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
    } catch (e) { this.ctx = null; }
    Music.init();
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : this.VOLUME;
    try { localStorage.setItem('muted', m ? '1' : '0'); } catch (e) {}
    document.querySelectorAll('[data-act="mute"]').forEach(b => b.textContent = m ? '🔇 音效關' : '🔊 音效開');
  },
  ready(key, gap) {
    if (!this.ctx || this.muted) return false;
    const t = performance.now();
    if (this.last[key] && t - this.last[key] < gap) return false;
    this.last[key] = t;
    return true;
  },
  tone({ type = 'square', f = 440, f2 = 0, dur = 0.1, vol = 0.2, delay = 0 }) {
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  hiss({ dur = 0.15, vol = 0.2, freq = 1200, f2 = 0, filter = 'lowpass', q = 1, delay = 0 }) {
    const c = this.ctx, t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise;
    f.type = filter; f.Q.value = q;
    f.frequency.setValueAtTime(freq, t);

// MUSIC — 背景音樂（Web Audio 即時合成，不需要音檔）

//   battle：一般戰鬥，118 BPM，貝斯＋琶音＋鼓
//   boss  ：旗艦戰，140 BPM，定音鼓、銅管重擊、合唱鋪底、推進的鼓組；王暴走時加上主旋律與更密的鼓

// =====================================================================
const Music = {
  on: true, gain: null, track: null, want: null, step: 0, nextT: 0, timer: null, rage: false, VOL: 0.55,
  TRACKS: {
    calm:   { bpm: 80,  bars: [[62, 65, 69], [58, 62, 65], [65, 69, 72], [60, 64, 67]], barSteps: 32 },  // Dm Bb F C（每和弦 2 小節）
    battle: { bpm: 118, bars: [[62, 65, 69], [58, 62, 65], [60, 64, 67], [62, 65, 69]], barSteps: 16 },  // Dm Bb C Dm
    boss:   { bpm: 132, bars: [[62, 65, 69], [58, 62, 65], [55, 58, 62], [57, 61, 64]], barSteps: 16 },  // Dm Bb Gm A（A 大三和弦製造緊張感）
  },
  init() {

  toggle() {

  fadeTo(v, sec) {

  // 每一幀依遊戲狀態決定要播哪首；換曲時先淡出再換
  update() {
    if (!this.gain) return;
    const boss = Game.inArena && Game.enemies.find(e => e.t.boss && !e.dead);
    const want = Game.state === 'dead' ? null
      : Game.inArena ? (boss || (Game.combat && Game.combat.boss) ? 'boss' : 'battle') : 'calm';
    this.rage = !!(boss && boss.enraged);
    if (want === this.want) return;
    this.want = want;

  },
  tick() {

    while (this.nextT < c.currentTime + 0.25) {

  },
  // ---------- 音色 ----------
  hz: m => 440 * Math.pow(2, (m - 69) / 12),
  // rev：送進殘響的比例（0 = 不送）
  note(type, m, t, dur, vol, { attack = 0.01, cutoff = 0, detune = 0, q = 1, rev = 0 } = {}) {

  send(node, rev) {

    node.connect(s); s.connect(this.verb);

  drum(kind, t, vol, rev = 0) {
    const c = SFX.ctx, g = c.createGain();

    const SW = { kick: [150, 45, 0.14, 0.2], timpani: [110, 38, 0.6, 0.9], tom: [120, 62, 0.25, 0.45], taiko: [80, 40, 0.35, 0.7] }[kind];
    if (SW) {
      const o = c.createOscillator();
      o.frequency.setValueAtTime(SW[0], t); o.frequency.exponentialRampToValueAtTime(SW[1], t + SW[2]);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + SW[3]);
      o.connect(g); o.start(t); o.stop(t + SW[3] + 0.05);
      return;
    }
    // 雜訊類：踩鈸、小鼓、大鈸（crash）
    const N = { hat: ['highpass', 7000, 0.04], snare: ['bandpass', 1800, 0.16], crash: ['highpass', 4000, 1.6] }[kind];
    const s = c.createBufferSource(), f = c.createBiquadFilter();

  chordOf(T, s) { return T.bars[Math.floor(s / T.barSteps) % T.bars.length]; },
  // ---------- 三首曲子：每個 16 分音符呼叫一次 ----------
  calm(s, t, T, dt) {
    const ch = this.chordOf(T, s), i = s % T.barSteps;

    if (s % 2 === 0) {  // 8 分音符琶音：和弦音往上爬再下來
      const seq = [0, 1, 2, 3, 2, 1], k = seq[(s / 2) % seq.length], m = ch[k % 3] + (k >= 3 ? 12 : 0) + 12;

  battle(s, t, T, dt) {

    if (i % 2 === 1) this.drum('hat', t, 0.06);
    if (i % 2 === 0) this.note('sawtooth', ch[0] - 24 + (i % 8 === 6 ? 12 : 0), t, dt * 1.8, 0.09, { cutoff: 500 });  // 貝斯
    const arp = [0, 1, 2, 1], m = ch[arp[i % 4]] + (i >= 8 ? 12 : 0);
    this.note('triangle', m, t, dt * 1.5, 0.03);
    if (i === 0) for (const n of ch) this.note('sawtooth', n - 12, t, dt * 16, 0.015, { attack: 0.3, cutoff: 900 });
  },
  // 旗艦戰：前 2 小節只有太鼓＋合唱的前奏，之後全部進來；暴走時旋律升八度加倍、鼓更密
  //   主旋律（銅管）：每個和弦一小節、8 分音符為單位，null = 延長前一個音
  BOSS_MELODY: [
    [62, null, 62, 64, 65, null, 64, 62],    // Dm
    [58, null, 62, 65, 65, null, 64, 62],    // B♭
    [58, null, 55, 58, 62, null, 60, 58],    // Gm
    [57, null, 61, 64, 69, null, 64, 61],    // A
  ],
  boss(s, t, T, dt) {
    const ch = this.chordOf(T, s), i = s % 16, bar = Math.floor(s / 16), r = this.rage, intro = bar < 2;
    // ---- 打擊：定音鼓、太鼓、大鼓、小鼓、踩鈸、大鈸 ----
    if (i === 0) this.drum('timpani', t, 0.75, 0.5);
    if (bar % 4 === 0 && i === 0 && !intro) this.drum('crash', t, 0.12, 0.4);
    if ([0, 3, 6, 10].includes(i)) this.drum('taiko', t, intro ? 0.45 : 0.6, 0.35);
    if ([7, 11, 14, 15].includes(i)) this.drum('tom', t, 0.35, 0.3);
    if (!intro) {
      if ([0, 8].includes(i) || (r && [3, 11].includes(i))) this.drum('kick', t, 0.5);
      if (i === 4 || i === 12) this.drum('snare', t, 0.28, 0.25);
      if (r || i % 2 === 0) this.drum('hat', t, r ? 0.05 : 0.035);
      if (bar % 2 === 1 && i >= 12) this.drum('snare', t, 0.1 + (i - 12) * (r ? 0.06 : 0.035));  // 小節尾巴的鼓滾
    }
    // ---- 合唱：每小節一個長和弦，4 個聲部（和弦＋低八度根音），大量殘響 ----
    if (i === 0) {
      for (const n of [ch[0] - 12, ...ch]) for (const d of [-10, 10])
        this.note('sawtooth', n, t, dt * 16.5, intro ? 0.016 : 0.012, { cutoff: 900, detune: d, attack: 0.35, rev: 0.8 });
    }
    if (intro) return;
    // ---- 低音：16 分音符的根音脈動（八度跳動） ----
    this.note('sawtooth', ch[0] - 24 + (i % 4 === 2 ? 12 : 0), t, dt * 0.85, 0.075, { cutoff: 420, q: 5 });

    const ost = [0, 2, 1, 2], so = ch[ost[i % 4]] + (i >= 8 ? 12 : 0);

    if (i % 2 === 0) {

    if (i === 0 || i === 14) for (const n of ch) this.note('sawtooth', n - 12, t, dt * 2.5, 0.03, { cutoff: 1200, detune: 6, attack: 0.015, rev: 0.4 });
  },

class Player {
  constructor(ship) {
    this.ship = ship;
    this.r = ship.radius; this.hp = this.maxHp = ship.hp;
    this.resetPos();
  }
  resetPos() {
    this.x = CFG.WORLD_W / 2; this.y = CFG.WORLD_H / 2; this.vx = 0; this.vy = 0;
    this.iframe = 0; this.fireCd = 0; this.aim = 0; this.moving = false;
    this.dashT = 0; this.dashCd = 0; this.dashA = 0; this.overdrive = 0; this.target = null;
  }
  onDash() {  // 角色技能：衝刺觸發
    const S = this.ship;
    if (Net.role === 'client') {  // 連線的隊友：震波傷害由房主計算，這裡只畫特效
      if (S.ability === 'shockwave') {
        for (let i = 0; i < 36 && Game.particles.length < 1500; i++) {
          const a = i / 36 * TAU;
          Game.particles.push({ x: this.x, y: this.y, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, life: 0.28, max: 0.28, color: S.color, size: 3 });
        }
        Game.shake(6);
      }
      if (S.ability === 'phase') this.overdrive = 1.2;
      return;
    }
    if (S.ability === 'shockwave') {
      for (const e of Game.enemies) {
        if (e.dead || e.spawnT > 0) continue;
        const d = Math.hypot(e.x - this.x, e.y - this.y);
        if (d > 150 + e.r) continue;
        const k = 420 * (14 / e.r) / (d || 1);
        e.hurt(20, (e.x - this.x) * k, (e.y - this.y) * k, 'shock', { src: 'ship', cr: null });
        floatText(e.x, e.y - e.r, 20, S.color);
      }
      for (let i = 0; i < 36 && Game.particles.length < 1500; i++) {
        const a = i / 36 * TAU;
        Game.particles.push({ x: this.x, y: this.y, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, life: 0.28, max: 0.28, color: S.color, size: 3 });
      }
      Game.shake(6);
      SFX.play('shock');
    }
    if (S.ability === 'phase') this.overdrive = 1.2;
  }
  get invuln() { return this.iframe > 0 || this.dashT > 0; }
  update(dt) {
    const K = Input.keys, P = Game.passives;
    let mx = 0, my = 0;
    if (K.has('w') || K.has('arrowup')) my -= 1;
    if (K.has('s') || K.has('arrowdown')) my += 1;
    if (K.has('a') || K.has('arrowleft')) mx -= 1;
    if (K.has('d') || K.has('arrowright')) mx += 1;
    if (Input.joy) { const v = stickVec(Input.joy); mx = v.x; my = v.y; }
    this.moving = Math.hypot(mx, my) > 0.1;
    if (Input.touch) {
      // 右搖桿拖曳 = 手動瞄準；否則鎖定最近敵人（自動攻擊開啟時不用按也會射）
      const a = Input.aimStick, v = a && stickVec(a);
      let target = null;
      if (v && v.len > 14) this.aim = Math.atan2(v.y, v.x);
      else {
        // 自動攻擊的索敵距離依武器射程調整（近戰武器只在敵人靠近時攻擊）
        const wp = Game.wp, reach = clamp(wp.speed * wp.life + 40, 140, CFG.AUTO_RANGE);
        target = nearestEnemy(this.x, this.y, a ? 900 : reach, null);
        if (target) this.aim = Math.atan2(target.y - this.y, target.x - this.x);
      }
      Input.down = !!a || (Input.autoFire && !!target);
      this.target = Input.down ? target : null;
    } else {
      this.aim = Math.atan2(Input.my / ZOOM + Game.cam.y - this.y, Input.mx / ZOOM + Game.cam.x - this.x);
    }

    this.dashCd -= dt;
    if (Input.dash) {
      Input.dash = false;
      if (this.dashCd <= 0) {
        this.dashT = CFG.DASH_TIME;
        this.dashCd = this.ship.dashCd * (1 - P.dashCd);
        this.dashA = this.moving ? Math.atan2(my, mx) : this.aim;
        this.dashSeq = (this.dashSeq || 0) + 1;  // 連線時告訴房主「衝刺了一次」
        burst(this.x, this.y, this.ship.color, 10, 160, 0.3, 2);

      this.vy = Math.sin(this.dashA) * CFG.DASH_SPEED;
      if (Game.particles.length < 1500)
        Game.particles.push({ x: this.x, y: this.y, vx: 0, vy: 0, life: 0.25, max: 0.25, color: this.ship.color, size: 5 });
    } else {
      const l = Math.max(1, Math.hypot(mx, my)), spd = this.ship.speed * (1 + P.speed), k = Math.min(1, dt * 12);
      this.vx += (mx / l * spd - this.vx) * k;
      this.vy += (my / l * spd - this.vy) * k;
    }
    this.x = clamp(this.x + this.vx * dt, this.r, CFG.WORLD_W - this.r);
    this.y = clamp(this.y + this.vy * dt, this.r, CFG.WORLD_H - this.r);

    this.iframe -= dt;
    this.overdrive -= dt;
    this.fireCd -= dt;
    this.wantFire = Input.down;
    if (Net.role === 'client') return;  // 連線的隊友：開火交給房主（子彈、傷害都由房主計算）
    if (Input.down && this.fireCd <= 0) {
      this.fire();
      this.fireCd = Game.stats.interval;
    }
  }
  fire() {
    const list = runOps(Game.stats.ops, 0);
    if (!list.length) return;
    if (this.overdrive > 0) for (const s of list) s.damage *= 1.5;  // 幻影號：相位超載
    const nx = this.x + Math.cos(this.aim) * 16, ny = this.y + Math.sin(this.aim) * 16;
    // 子彈從船身中心附近發出：怪物貼臉時也打得到（槍口火光仍在船頭）
    spawnShots(list, this.x + Math.cos(this.aim) * 4, this.y + Math.sin(this.aim) * 4, this.aim, 0, null);
    SFX.play('shoot', Game.weapon.id);
    burst(nx, ny, list[0].color, 3, 120, 0.15, 2);
  }
}

class Bullet {
  constructor(x, y, angle, s, depth, ignoreId) {
    this.x = x; this.y = y; this.px = x; this.py = y; this.angle = angle;
    this.sx = x; this.sy = y;  // 發射點：畫尾巴時不超過已飛行的距離（不然剛射出時尾巴會從船屁股露出來）
    this.speed = s.speed; this.damage = s.damage; this.r = s.radius;
    this.pierce = s.pierce; this.bounce = s.bounce; this.homing = s.homing;
    this.life = s.life; this.color = s.color; this.shape = s.shape;
    this.payload = s.payload; this.depth = depth;
    this.explode = s.explode; this.burn = s.burn; this.shards = s.shards; this.shard = s.shard; this.arcs = s.arcs || null;
    this.slow = s.slow; this.knock = s.knock; this.lifesteal = s.lifesteal;
    this.att = { src: s.src || 'weapon', cr: s.cr };  // 傷害統計歸屬
    this.splits = s.splits || 0;  // 被分裂過幾次（畫面上顯示殘影用）
    this.hitSet = new Set();
    if (ignoreId != null) this.hitSet.add(ignoreId);
    this.owner = Game.shooter || null;  // 雙人：這顆子彈是誰的電路射出的（null = 房主自己）
    this.dead = false;
  }
  update(dt) {
    if (this.homing > 0) {
      const t = nearestEnemy(this.x, this.y, 450, this.hitSet);
      if (t) {
        const turn = this.homing * dt;
        this.angle += clamp(angleDiff(this.angle, Math.atan2(t.y - this.y, t.x - this.x)), -turn, turn);
      }
    }
    this.px = this.x; this.py = this.y;  // 記住這一幀的起點，碰撞用整段路徑判定
    this.x += Math.cos(this.angle) * this.speed * dt;
    this.y += Math.sin(this.angle) * this.speed * dt;
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    const W = CFG.WORLD_W, H = CFG.WORLD_H;
    if (this.x < 0 || this.x > W) {
      if (this.bounce > 0) { this.bounce--; this.angle = Math.PI - this.angle; this.x = clamp(this.x, 0, W); }
      else this.dead = true;
    }
    if (this.y < 0 || this.y > H) {
      if (this.bounce > 0) { this.bounce--; this.angle = -this.angle; this.y = clamp(this.y, 0, H); }
      else this.dead = true;
    }
  }
}

function spawnShots(list, x, y, baseAngle, depth, ignoreId) {
  const B = Game.bullets;
  for (const s of list) {
    if (B.length >= CFG.MAX_LIVE_BULLETS) break;
    B.push(new Bullet(x, y, baseAngle + s.angle, s, depth, ignoreId));
  }
}

// 晶體飛行：進入拾取範圍（或波次清空後全場吸取）就被拉向玩家。房主與隊友用同一套算法，隊友畫面才會順
function stepPickup(c, p, range, d2, dt) {
  if (c.vacuum || d2 < range * range) {
    const d = Math.sqrt(d2) || 1, f = c.vacuum ? 3000 : 1400;
    c.vx += (p.x - c.x) / d * f * dt; c.vy += (p.y - c.y) / d * f * dt;
  }
  c.vx *= 0.92; c.vy *= 0.92;
  c.x += c.vx * dt; c.y += c.vy * dt;
}

function nearestEnemy(x, y, range, exclude) {
  let best = null, bd = range * range;
  for (const e of Game.enemies) {
    if (e.dead || (exclude && exclude.has(e.id))) continue;
    const d = dist2(x, y, e.x, e.y);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

const ENEMY_TYPES = {
  swarmer: { name: '蟲群', hp: 18, speed: 150, radius: 10, dmg: 10, color: '#ff4d6d', credits: 1, shape: 3 },
  brute:   { name: '刺殼', hp: 130, speed: 65, radius: 22, dmg: 25, color: '#ff9f1c', credits: 4, shape: 6 },  // 靠近時縮成球滾過來（見 updateBrute）
  spitter: { name: '噴吐者', hp: 40, speed: 110, radius: 13, dmg: 10, color: '#f72585', credits: 2, shape: 4,
    ranged: { range: 380, cd: 1.8, speed: 260, dmg: 12 } },
  elite:   { name: '虛空獵手', hp: 520, speed: 95, radius: 26, dmg: 30, color: '#ffd400', credits: 12, shape: 5, elite: true },
  // 三隻旗艦：第 1～3 關依序出現，無盡模式隨機抽
  boss:    { name: '星噬母艦', hp: 2600, speed: 45, radius: 50, dmg: 35, color: '#ff4d6d', credits: 40, shape: 8, boss: true,
    knockResist: 1.5, rage: '母艦核心暴走', skills: ['spiral', 'fan', 'summon', 'ring'],
    desc: '螺旋彈幕、扇形齊射、召喚蟲群、環形彈。' },
  boss2:   { name: '裂界獵艦', hp: 2800, speed: 80, radius: 42, dmg: 35, color: '#b388ff', credits: 40, shape: 3, boss: true,
    knockResist: 2.5, rage: '獵艦推進器過載', skills: ['charge', 'cross', 'snipe', 'charge', 'deploy'],
    desc: '高速衝鋒（有預警線，衝鋒時往兩側灑彈）、旋轉十字彈流、三連狙擊、部署噴吐者。' },
  boss3:   { name: '終焉核心', hp: 3000, speed: 35, radius: 56, dmg: 40, color: '#2ee6a6', credits: 40, shape: 6, boss: true,
    knockResist: 3.5, rage: '核心臨界', skills: ['nova', 'twin', 'wall', 'guard'],
    desc: '連續缺口環形波、雙向螺旋、慢速彈牆、召喚刺殼護衛。' },
};

class Enemy {
  constructor(type, x, y, hpScale) {
    const t = ENEMY_TYPES[type];
    this.id = Game.nextId++; this.type = type; this.t = t;
    this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.hp = this.maxHp = t.hp * hpScale; this.r = t.radius;
    this.flash = 0; this.spawnT = t.boss ? 1.6 : t.elite ? 1.2 : 0.6; this.spawnMax = this.spawnT;
    this.hpScale = hpScale;
    // Boss 狀態
    this.skill = null; this.skillT = 0; this.skillIdx = 0; this.spin = 0; this.fireAcc = 0;
    this.stream = null; this.volley = null; this.ringQ = []; this.enraged = false;
    this.rollCd = rand(0.5, 1.5); this.bounced = false;  // 刺殼滾球用
    this.phase = rand(0, TAU); this.rot = rand(0, TAU);
    this.cd = t.ranged ? rand(0.8, t.ranged.cd) : 0;
    this.burnT = 0; this.burnDps = 0; this.burnAcc = 0; this.slowT = 0; this.slowAmt = 0;
    this.mode = 'chase'; this.skillCd = 2.5; this.nextSkill = 'charge'; this.modeT = 0; this.chargeA = 0;
    this.dead = false;
  }
  move(dt) {
    this.x = clamp(this.x + this.vx * dt, this.r, CFG.WORLD_W - this.r);
    this.y = clamp(this.y + this.vy * dt, this.r, CFG.WORLD_H - this.r);
  }
  update(dt, p) {
    this.flash = Math.max(0, this.flash - dt);
    if (this.burnT > 0) {  // 燃燒：持續扣血
      this.burnT -= dt;
      this.burnAcc += this.burnDps * dt;
      if (this.burnAcc >= 1) {
        const d = Math.floor(this.burnAcc);
        this.burnAcc -= d;
        Game.recordDamage('burn', Math.min(d, Math.max(0, this.hp)), this.burnAtt);
        this.hp -= d;
        if (Math.random() < 0.4) burst(this.x, this.y, '#ff9f1c', 2, 60, 0.3, 2);
        if (this.hp <= 0 && !this.dead) { this.dead = true; Game.onEnemyKilled(this); return; }
      }
    }
    if (this.slowT > 0) this.slowT -= dt;
    this.spdMul = this.slowT > 0 ? 1 - this.slowAmt : 1;
    if (this.spawnT > 0) { this.spawnT -= dt; return; }
    const t = this.t;
    const dx = p.x - this.x, dy = p.y - this.y, d = Math.hypot(dx, dy) || 1;
    this.rot += dt * (this.type === 'brute' ? 0.8 : this.type === 'elite' ? 1.5 : this.type === 'boss' ? 0.4 : 0);
    if (t.boss) { this.updateBoss(dt, dx, dy, d); return; }
    if (this.type === 'brute' && this.updateBrute(dt, dx, dy, d)) return;

    if (t.elite) {  // 精英：蓄力衝鋒 / 環形彈幕 交替
      if (this.mode === 'windup') {
        this.modeT -= dt; this.vx *= 0.85; this.vy *= 0.85; this.move(dt);
        if (this.modeT <= 0) {
          this.mode = 'charge'; this.modeT = 0.45;
          this.vx = Math.cos(this.chargeA) * 680; this.vy = Math.sin(this.chargeA) * 680;
        }
        return;
      }
      if (this.mode === 'charge') {
        this.modeT -= dt; this.move(dt);
        if (Game.particles.length < 1500)
          Game.particles.push({ x: this.x, y: this.y, vx: 0, vy: 0, life: 0.3, max: 0.3, color: t.color, size: 6 });
        if (this.modeT <= 0) this.mode = 'chase';
        return;
      }
      this.skillCd -= dt;
      if (this.skillCd <= 0) {
        this.skillCd = 3;
        if (this.nextSkill === 'charge') {
          this.mode = 'windup'; this.modeT = 0.65; this.chargeA = Math.atan2(dy, dx); this.nextSkill = 'ring';
        } else {
          for (let i = 0; i < 14; i++) {
            const a = i / 14 * TAU + this.rot;
            Game.eBullets.push({ x: this.x, y: this.y, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, r: 6, dmg: 14, life: 4, from: t.name });
          }
          this.nextSkill = 'charge';
        }
      }
    }

    let mx = dx / d, my = dy / d;
    if (this.type === 'swarmer') {
      const w = Math.sin(Game.time * 6 + this.phase) * 0.6;
      mx += -my * w; my += (dx / d) * w;
    }
    if (t.ranged) {
      const R = t.ranged.range;
      if (d < R * 0.55) { mx = -mx; my = -my; }
      else if (d < R * 0.9) { const s = Math.sin(this.phase) > 0 ? 1 : -1; mx = -dy / d * s; my = dx / d * s; }
      this.cd -= dt;
      if (this.cd <= 0 && d < R + 120) {
        this.cd = t.ranged.cd;
        const a = Math.atan2(dy, dx);
        Game.eBullets.push({ x: this.x, y: this.y, vx: Math.cos(a) * t.ranged.speed, vy: Math.sin(a) * t.ranged.speed,
          r: 5, dmg: t.ranged.dmg, life: 3, from: t.name });
        SFX.play('eshot');
      }
    }
    const ml = Math.hypot(mx, my) || 1;
    const k = Math.min(1, dt * 4);
    this.vx += (mx / ml * t.speed * this.spdMul - this.vx) * k;
    this.vy += (my / ml * t.speed * this.spdMul - this.vy) * k;
    this.move(dt);
  }
  // ---------- 刺殼：平常慢慢走；靠近時縮成球（有預警線）→ 高速滾向玩家（撞牆反彈一次）→ 暈眩 ----------
  //   回傳 true 表示這一幀的移動已經處理完（縮球、滾動、暈眩中）；false 則照一般追擊
  updateBrute(dt, dx, dy, d) {
    const B = CFG.BRUTE, W = CFG.WORLD_W, H = CFG.WORLD_H;
    if (this.mode === 'windup') {  // 縮成球：前半段還會跟著玩家轉向，後半段鎖定方向
      this.modeT -= dt; this.vx *= 0.8; this.vy *= 0.8; this.move(dt);
      if (this.modeT > B.lock) this.chargeA = Math.atan2(dy, dx);
      if (this.modeT <= 0) {
        this.mode = 'charge'; this.modeT = B.rollT; this.bounced = false;
        const s = B.rollSpeed * this.spdMul;
        this.vx = Math.cos(this.chargeA) * s; this.vy = Math.sin(this.chargeA) * s;
      }
      return true;
    }
    if (this.mode === 'charge') {  // 滾動：不吃擊退（hurt 裡處理），撞牆反彈一次，第二次撞牆就停
      this.modeT -= dt; this.move(dt); this.rot += dt * 14;
      const hitX = (this.x <= this.r + 0.5 && this.vx < 0) || (this.x >= W - this.r - 0.5 && this.vx > 0);
      const hitY = (this.y <= this.r + 0.5 && this.vy < 0) || (this.y >= H - this.r - 0.5 && this.vy > 0);
      if (hitX || hitY) {
        if (this.bounced) this.modeT = 0;
        else { this.bounced = true; if (hitX) this.vx = -this.vx; if (hitY) this.vy = -this.vy; this.chargeA = Math.atan2(this.vy, this.vx); Game.shake(3); }
      }
      if (Game.particles.length < 1500 && Math.random() < 0.5)
        Game.particles.push({ x: this.x, y: this.y, vx: 0, vy: 0, life: 0.25, max: 0.25, color: this.t.color, size: 5 });
      if (this.modeT <= 0) { this.mode = 'stun'; this.modeT = B.stunT; }
      return true;
    }
    if (this.mode === 'stun') {  // 暈眩：滑行停下，這段時間是反擊的機會
      this.modeT -= dt; this.vx *= 0.88; this.vy *= 0.88; this.move(dt);
      if (this.modeT <= 0) { this.mode = 'chase'; this.rollCd = B.cooldown; }
      return true;
    }
    this.rollCd -= dt;
    if (this.rollCd <= 0 && d < B.range) { this.mode = 'windup'; this.modeT = B.windup; this.chargeA = Math.atan2(dy, dx); return true; }
    return false;
  }
  // ---------- 旗艦（三隻共用框架，技能清單寫在 ENEMY_TYPES.skills；半血後暴走） ----------
  //   星噬母艦：螺旋彈幕 / 扇形齊射 / 召喚蟲群 / 環形彈
  //   裂界獵艦：預警衝鋒（兩側灑彈）/ 旋轉十字彈流 / 三連狙擊 / 部署噴吐者
  //   終焉核心：缺口環形波 / 雙向螺旋 / 慢速彈牆 / 刺殼護衛
  shootAt(a, spd, r = 6, dmg = 14) {
    Game.eBullets.push({ x: this.x, y: this.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r, dmg, life: 10, from: this.t.name });  // 王的子彈存在 10 秒
  }
  ring(n, spd, offset, gap = 0) {  // gap：連續空出幾發，讓玩家有縫可鑽
    const g0 = gap ? randInt(0, n - 1) : -1;
    for (let i = 0; i < n; i++) if (!gap || mod(i - g0, n) >= gap) this.shootAt(offset + i / n * TAU, spd);
  }
  summon(type, n, dist, scale) {
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + this.rot;
      Game.enemies.push(new Enemy(type, clamp(this.x + Math.cos(a) * dist, 40, CFG.WORLD_W - 40),
        clamp(this.y + Math.sin(a) * dist, 40, CFG.WORLD_H - 40), this.hpScale * scale));
    }
    burst(this.x, this.y, this.t.color, 24, 200, 0.5, 2);
  }
  updateBoss(dt, dx, dy, d) {
    const t = this.t, rage = this.hp < this.maxHp * 0.5;
    if (rage && !this.enraged) {
      this.enraged = true; this.skillCd = Math.min(this.skillCd, 1);
      Game.banner = { text: t.rage, sub: '攻擊頻率上升', t: 2 };
      Game.shake(14);
      burst(this.x, this.y, t.color, 60, 380, 0.8, 3);
    }
    if (this.mode === 'windup') {  // 裂界獵艦：蓄力（畫面上有預警線），期間慢慢停下
      this.modeT -= dt; this.vx *= 0.85; this.vy *= 0.85; this.move(dt);
      if (this.modeT <= 0) {
        this.mode = 'charge'; this.modeT = 0.6; this.fireAcc = 0;
        this.vx = Math.cos(this.chargeA) * 760; this.vy = Math.sin(this.chargeA) * 760;
        Game.shake(6);
      }
    } else if (this.mode === 'charge') {  // 衝鋒：往兩側灑出慢速彈，撞牆或時間到就停
      this.modeT -= dt; this.move(dt); this.fireAcc += dt;
      while (this.fireAcc >= 0.07) {
        this.fireAcc -= 0.07;
        this.shootAt(this.chargeA + Math.PI / 2, 110, 5, 12);
        this.shootAt(this.chargeA - Math.PI / 2, 110, 5, 12);
      }
      if (Game.particles.length < 1500)
        Game.particles.push({ x: this.x, y: this.y, vx: 0, vy: 0, life: 0.35, max: 0.35, color: t.color, size: 8 });
      const wall = this.x <= this.r + 1 || this.x >= CFG.WORLD_W - this.r - 1 || this.y <= this.r + 1 || this.y >= CFG.WORLD_H - this.r - 1;
      if (this.modeT <= 0 || wall) { this.mode = 'chase'; this.vx *= 0.3; this.vy *= 0.3; }
    } else {
      // 與玩家保持距離並緩慢繞行（獵艦貼得比較近，核心幾乎不動）
      const [far, near, orbit] = this.type === 'boss2' ? [300, 180, 60] : this.type === 'boss3' ? [460, 260, 18] : [340, 220, 35];
      const want = d > far ? 1 : d < near ? -1 : 0;
      const sp = t.speed * this.spdMul;
      const tvx = dx / d * sp * want - dy / d * orbit, tvy = dy / d * sp * want + dx / d * orbit;
      const k = Math.min(1, dt * 2);
      this.vx += (tvx - this.vx) * k; this.vy += (tvy - this.vy) * k;
      this.move(dt);
    }

    const S = this.stream;  // 持續彈流（螺旋 / 十字 / 雙向螺旋）
    if (S && S.t > 0) {
      S.t -= dt; this.fireAcc += dt;
      while (this.fireAcc >= S.every) {
        this.fireAcc -= S.every; this.spin += S.turn;
        for (let i = 0; i < S.arms; i++) {
          this.shootAt(this.spin + i * TAU / S.arms, S.spd, S.r, S.dmg);
          if (S.twin) this.shootAt(-this.spin + i * TAU / S.arms, S.spd, S.r, S.dmg);
        }
      }
    }
    const V = this.volley;  // 瞄準玩家的連續齊射
    if (V && V.n > 0) {
      V.T -= dt;
      if (V.T <= 0) {
        V.T = V.every; V.n--;
        const a0 = Math.atan2(dy, dx);
        if (V.kind === 'fan') { const w = rage ? 3 : 2; for (let i = -w; i <= w; i++) this.shootAt(a0 + i * 0.14, 300); }
        if (V.kind === 'snipe') for (const o of [-0.07, 0, 0.07]) this.shootAt(a0 + o, 440, 5, 16);
        if (V.kind === 'wall') {  // 15 發慢速彈排成一道牆，每一波錯開半格
          const shift = (V.n % 2) * 0.5;
          for (let i = 0; i < 15; i++) this.shootAt(a0 + (i + shift - 7) * 0.1, 140, 7, 15);
        }
      }
    }
    for (const q of this.ringQ) {  // 延遲發射的環形彈
      q.t -= dt;
      if (q.t <= 0) this.ring(q.n, q.spd, q.off, q.gap);
    }
    this.ringQ = this.ringQ.filter(q => q.t > 0);

    this.skillCd -= dt;
    if (this.skillCd > 0 || this.mode !== 'chase') return;
    this.skill = t.skills[this.skillIdx++ % t.skills.length];
    switch (this.skill) {
      // 星噬母艦
      case 'spiral':
        this.stream = { t: 3, every: rage ? 0.05 : 0.08, arms: rage ? 3 : 2, turn: 0.33, spd: 190, r: 5, dmg: 12 };
        this.fireAcc = 0; this.skillCd = rage ? 3.6 : 4.4; break;
      case 'fan': this.volley = { kind: 'fan', n: rage ? 4 : 3, T: 0, every: 0.35 }; this.skillCd = rage ? 2.4 : 3; break;
      case 'summon': this.summon('swarmer', rage ? 8 : 5, 80, 0.8); this.skillCd = rage ? 2.6 : 3.2; break;
      case 'ring':
        this.ring(24, 170, this.rot);
        if (rage) this.ringQ.push({ t: 0.45, n: 24, spd: 170, off: this.rot + TAU / 48, gap: 0 });
        this.skillCd = rage ? 2.2 : 2.8; break;
      // 裂界獵艦
      case 'charge':
        this.mode = 'windup'; this.modeT = rage ? 0.55 : 0.8; this.chargeA = Math.atan2(dy, dx);
        this.skillCd = rage ? 2.2 : 2.8; break;
      case 'cross':
        this.stream = { t: 3, every: rage ? 0.08 : 0.11, arms: rage ? 6 : 4, turn: 0.07, spd: 230, r: 5, dmg: 13 };
        this.fireAcc = 0; this.skillCd = rage ? 3.4 : 4; break;
      case 'snipe': this.volley = { kind: 'snipe', n: rage ? 4 : 3, T: 0, every: 0.28 }; this.skillCd = rage ? 2 : 2.6; break;
      case 'deploy': this.summon('spitter', rage ? 3 : 2, 90, 0.7); this.skillCd = rage ? 2.4 : 3; break;
      // 終焉核心
      case 'nova': {
        const n = rage ? 4 : 3;
        for (let i = 0; i < n; i++) this.ringQ.push({ t: i * 0.55, n: 32, spd: rage ? 170 : 150, off: rand(0, TAU), gap: 5 });
        this.skillCd = rage ? 3 : 3.6; break;
      }
      case 'twin':
        this.stream = { t: 3.2, every: rage ? 0.07 : 0.1, arms: 2, turn: 0.22, spd: 170, r: 6, dmg: 13, twin: true };
        this.fireAcc = 0; this.skillCd = rage ? 3.8 : 4.4; break;
      case 'wall': this.volley = { kind: 'wall', n: rage ? 3 : 2, T: 0, every: 0.6 }; this.skillCd = rage ? 2.6 : 3.2; break;
      case 'guard':
        this.summon('brute', rage ? 2 : 1, 110, 0.6);
        this.summon('swarmer', rage ? 6 : 4, 80, 0.8);
        this.skillCd = rage ? 3 : 3.6; break;
    }
  }
  // knock：子彈的擊退值（只有子彈命中會帶）。旗艦只有在擊退值超過自己的抗擊退時才會被推，力道只看超過的部分；
  // 爆炸、震波、電弧不會推王。衝鋒中的敵人不會被推
  hurt(dmg, kx, ky, source = 'direct', att = null, knock = null) {
    Game.recordDamage(source, Math.min(dmg, Math.max(0, this.hp)), att);  // 只算實際扣掉的血
    this.hp -= dmg; this.flash = 0.08;
    if (this.t.boss) {
      const over = knock == null ? 0 : knock - this.t.knockResist, l = Math.hypot(kx, ky);
      if (over > 0 && l > 0 && this.mode !== 'charge') { this.vx += kx / l * over * CFG.BOSS_KNOCK; this.vy += ky / l * over * CFG.BOSS_KNOCK; }
    } else if (this.mode !== 'charge') { this.vx += kx; this.vy += ky; }
    if (this.hp <= 0 && !this.dead) { this.dead = true; Game.onEnemyKilled(this); }
  }
}

// =====================================================================
// GAME
// =====================================================================
const Game = {
  state: 'title', returnState: null, mode: null,
  chain: [], inventory: [], credits: 0,
  stats: null, passives: computePassives([]),
  map: null, node: null, visited: [], combat: null, inArena: false,
  cam: { x: 0, y: 0, shake: 0 },
  stars: [], bullets: [], enemies: [], eBullets: [], particles: [], texts: [], pickups: [], triggerQueue: [], rings: [], zaps: [],
  weapon: { id: 'laser', path: null, final: null }, wp: null,
  time: 0, nextId: 1,
  // 雙人：mate = 隊友的飛船（房主這邊是真的模擬對象，隊友那邊只是畫出來的影子）
  //   mate.L = 隊友的配裝（電路、倉庫、武器…），房主算隊友的子彈時用 withLoadout 暫時換上
  mate: null, shooter: null,

  // ---------- 雙人共用 ----------
  players() { return [this.player, this.mate].filter(p => p && !p.dead); },
  nearestPlayer(x, y) {
    let best = null, bd = Infinity;
    for (const p of this.players()) { const d = dist2(x, y, p.x, p.y); if (d < bd) { bd = d; best = p; } }
    return best || this.player;
  },
  // 暫時把 Game 的配裝換成 L（隊友的），執行完再換回來；L 為 null 時就是房主自己
  withLoadout(L, fn) {
    if (!L) return fn();
    const saved = {}, prev = this.shooter;
    for (const k of LOADOUT_KEYS) { saved[k] = this[k]; this[k] = L[k]; }
    this.shooter = L;
    try { return fn(); } finally {
      for (const k of LOADOUT_KEYS) { L[k] = this[k]; this[k] = saved[k]; }
      this.shooter = prev;
    }
  },
  passivesOf(p) { return p.L ? p.L.passives : this.passives; },

  // ---------- 一局的流程 ----------
  newRun(mode, shipId = this.shipId || 'vanguard', weaponId = this.weapon.id, startChip = null) {
    this.mode = mode;
    this.shipId = shipId;
    this.weapon = { id: weaponId, path: null, final: null };
    const S = SHIPS[shipId];
    // 先換上新的電路、倉庫、飛船，再計算數值（不能拿上一場的電路來算）
    // 遠征／雙人：開局三選一的起始晶片直接裝在電路上（武器右邊）；飛船不再自帶晶片
    this.chain = mode === 'sandbox' ? ['weapon', 'split', null, null] : startChain(startChip);
    this.inventory = Array(CFG.INV_SLOTS).fill(null);
    this.credits = mode === 'sandbox' ? 999 : 0;
    this.player = new Player(S);
    this.map = mode === 'run' ? genMap() : null;
    this.node = null; this.visited = []; this.sector = 1; this.bossId = this.bossFor(1);
    this.runStats = { dmg: Object.fromEntries(DMG_SOURCES.map(([k]) => [k, 0])), chips: {}, kills: 0, maxHit: 0, time: 0,
      bosses: [], started: Date.now(), recorded: false,
      // 遊玩紀錄用的判斷資料：受到的傷害來源、被打中次數、衝刺次數、走過的節點、取得的晶片、武器升級、各關摘要
      taken: {}, hits: 0, dashes: 0, path: [], got: [], upgrades: [], sectors: [] };
    this.sectorStats = { chips: {}, t0: 0, kills0: 0, dmg0: 0 };  // 「本關」＝目前這個星區
    this.nodeLog = null;
    this.lastHit = '';
    this.refreshWeapon();  // 內含 recalc()
    this.player.hp = this.player.maxHp;
    if (mode !== 'coop') { this.mate = null; Net.close(); }
    if (mode === 'sandbox') this.startCombat({ sandbox: true, level: 0 });
    else if (mode === 'coop') return;  // 雙人：由 Net 建好隊友之後再開戰
    else this.showMap();
  },
  // ---------- 遊玩紀錄：走過的節點 ----------
  here() { return `${this.sector}-${this.node ? this.node.L + 1 : 0}`; },
  totalDmg() { return this.runStats ? Object.values(this.runStats.dmg).reduce((a, b) => a + b, 0) : 0; },
  logNodeStart(node) {
    const R = this.runStats;
    if (!R) return;
    const label = node.type === 'boss' ? `旗艦・${ENEMY_TYPES[this.bossId].name}` : NODE_META[node.type].label;
    if (['combat', 'elite', 'boss'].includes(node.type))
      this.nodeLog = { at: this.here(), label, t0: R.time, hp0: this.player.hp, hits0: R.hits, dmg0: this.totalDmg() };
    else R.path.push(`${this.here()} ${label}`);
  },
  // 戰鬥節點的摘要：花幾秒、掉多少血、被打中幾下、打出多少傷害（ongoing = 還在打）
  nodeSummary(ongoing = false) {
    const N = this.nodeLog, R = this.runStats;
    if (!N || !R) return null;
    return `${N.at} ${N.label} ${Math.round(R.time - N.t0)}秒 HP ${Math.ceil(N.hp0)}→${Math.max(0, Math.ceil(this.player.hp))}` +
      `（被打 ${R.hits - N.hits0} 下）傷害 ${Math.round(this.totalDmg() - N.dmg0)}${ongoing ? ' ←進行中' : ''}`;
  },
  logNodeEnd() {
    const s = this.nodeSummary();
    if (s) this.runStats.path.push(s);
    this.nodeLog = null;
  },
  // 前三關依序打三隻不同的旗艦；無盡模式（第 4 關起）隨機抽
  bossFor(sector) { return sector <= CFG.CAMPAIGN_SECTORS ? CFG.BOSS_ORDER[sector - 1] : pick(CFG.BOSS_ORDER); },
  isEndless() { return this.sector > CFG.CAMPAIGN_SECTORS; },
  nodeById(id) { return this.map.flat().find(n => n.id === id); },
  reachable() {
    return this.node ? this.node.next.map(id => this.nodeById(id)) : this.map[0];
  },
  showMap(toast = '') {
    this.inArena = false; this.state = 'map';
    Screen.map(toast);
  },
  enterNode(node) {
    if (!this.reachable().includes(node)) return;
    this.node = node; this.visited.push(node.id);
    const L = node.L, level = L + (this.sector - 1) * 7;  // 每個星區難度往上疊
    this.logNodeStart(node);
    switch (node.type) {
      case 'combat': this.startCombat({ level, wavesTotal: 2 + (L >= 3 ? 1 : 0), elites: 0 }); break;
      case 'elite':  this.startCombat({ level, wavesTotal: 2, elites: 1 }); break;
      case 'boss':   this.startCombat({ level, wavesTotal: 1, elites: 0, boss: true }); break;
      case 'shop':   this.openShop(); break;
      case 'blackhole': this.openBlackhole(); break;
      case 'armory': this.state = 'armory'; this.armorySource = 'armory'; Screen.armory('armory'); break;
      case 'repair': {
        const p = this.player, heal = Math.round(p.maxHp * CFG.REPAIR_RATIO);
        p.hp = Math.min(p.maxHp, p.hp + heal);
        this.showMap(`維修完成：HP +${heal}`);
        break;
      }
    }
  },

  // ---------- 戰鬥 ----------
  startCombat(cfg) {
    this.combat = Object.assign({ wave: 0, waveTimer: 1.2, pending: [], spawnClock: 0, cleared: false, clearT: 0,
      wavesTotal: Infinity, elites: 0 }, cfg);
    this.bullets = []; this.enemies = []; this.eBullets = []; this.particles = [];
    this.texts = []; this.pickups = []; this.triggerQueue = []; this.rings = []; this.zaps = [];
    this.kills = 0; this.banner = null; this.nextId = 1;
    this.player.resetPos();
    // 雙人：房主在左、隊友在右（隊友的位置由隊友自己的電腦決定）
    if (Net.role === 'host') this.player.x -= 50;
    if (Net.role === 'client') this.player.x += 50;
    if (this.mate) { this.mate.resetPos(); this.mate.x += Net.role === 'host' ? 50 : -50; this.mate.dead = false; }
    this.player.dead = false;
    this.cam.x = this.player.x - ZW / 2; this.cam.y = this.player.y - ZH / 2;
    Input.down = false; Input.dash = false; Input.joy = null; Input.aimStick = null;
    try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
    this.inArena = true; this.state = 'play';
    Screen.hide();
  },
  startWave(n) {
    const C = this.combat;
    C.wave = n;
    if (C.boss) {
      C.pending = [this.bossId];
      this.banner = { text: `♛ ${ENEMY_TYPES[this.bossId].name}`, sub: '守關旗艦接近中', t: 2.5 };
      SFX.play('boss');
      return;
    }
    let budget = 5 + n * 3 + C.level * 3;
    const list = [];
    while (budget > 0) {
      const r = Math.random(), lv = C.sandbox ? n : C.level + n;
      if (lv >= 3 && r < 0.18 && budget >= 6) { list.push('brute'); budget -= 6; }
      else if (lv >= 2 && r < 0.45 && budget >= 3) { list.push('spitter'); budget -= 3; }
      else { list.push('swarmer'); budget -= 1; }
    }
    if (!C.sandbox && n === C.wavesTotal) for (let i = 0; i < C.elites; i++) list.push('elite');
    // 沙盒：每 10 波輪流出現三隻旗艦
    const sbBoss = C.sandbox && n % 10 === 0 ? CFG.BOSS_ORDER[(n / 10 - 1) % CFG.BOSS_ORDER.length] : null;
    if (sbBoss) list.push(sbBoss);
    else if (C.sandbox && n % 5 === 0) list.push('elite');
    C.pending = list;
    this.banner = { text: C.sandbox ? `WAVE ${n}` : `WAVE ${n} / ${C.wavesTotal}`, t: 2 };
    SFX.play(sbBoss ? 'boss' : 'wave');
    if (sbBoss) this.banner.sub = `♛ ${ENEMY_TYPES[sbBoss].name}接近中`;
    else if (list.includes('elite')) this.banner.sub = '⚠ 精英反應接近中';
  },
  spawnEnemy(type) {
    const C = this.combat, p = this.player, a = rand(0, TAU), d = rand(520, 780);
    const x = clamp(p.x + Math.cos(a) * d, 40, CFG.WORLD_W - 40);
    const y = clamp(p.y + Math.sin(a) * d, 40, CFG.WORLD_H - 40);
    const scale = (C.sandbox ? 1 + (C.wave - 1) * 0.12 : 1 + C.level * 0.15 + (C.wave - 1) * 0.08) *
      (this.mode === 'coop' ? 1.6 : 1);  // 雙人：敵人血量 ×1.6（暫定，第 3 步再調）
    const e = new Enemy(type, x, y, scale);
    this.enemies.push(e);
    burst(x, y, e.t.color, 10, 90, 0.5, 2);
  },
  updateWaves(dt) {
    const C = this.combat;
    if (C.cleared) {
      for (const c of this.pickups) c.vacuum = true;
      C.clearT -= dt;
      if (C.clearT <= 0) this.combatWon();
      return;
    }
    if (C.pending.length) {
      C.spawnClock -= dt;
      if (C.spawnClock <= 0) { C.spawnClock = 0.22; this.spawnEnemy(C.pending.shift()); }
    } else if (this.enemies.length === 0) {
      for (const c of this.pickups) c.vacuum = true;  // 每一波清完就把地上的晶體全部吸過來
      if (C.wave >= C.wavesTotal) {
        C.cleared = true; C.clearT = 1.6;
        this.banner = { text: '區域肅清', t: 1.6 };
        SFX.play('clear');
        return;
      }
      C.waveTimer -= dt;
      if (C.waveTimer <= 0) { C.waveTimer = 2.5; this.startWave(C.wave + 1); }
    }
  },
  combatWon() {
    this.inArena = false;
    this.credits += this.pickups.length;  // 沒吸完的晶體直接入帳
    this.pickups = [];
    const p = this.player;
    this.logNodeEnd();  // 先記下戰鬥結果（先鋒號回血之前的 HP）
    if (p.ship.ability === 'repair') p.hp = Math.min(p.maxHp, p.hp + 10);  // 先鋒號：戰地維修
    const type = this.node.type;
    if (type === 'boss') {  // 擊敗旗艦：插槽 +1、晶體獎勵，可前往下一星區
      const slot = this.chain.length < CFG.MAX_SLOTS;
      if (slot) this.chain.push(null);
      this.credits += 50;
      this.recalc();
      if (this.runStats) this.runStats.bosses.push(ENEMY_TYPES[this.bossId].name);
      this.victory = { slot, boss: this.bossId };
      this.state = 'victory';
      Screen.victory();
      return;
    }
    const kind = type === 'elite' ? 'elite' : 'combat';
    this.reward = { kind, options: kind === 'elite' ? pickN(COMPOSITE_IDS, 2) : pickN(NORMAL_IDS, 3), bonus: kind === 'elite' ? 15 : 0,
      slot: kind === 'elite' && this.chain.length < CFG.MAX_SLOTS };  // 精英獎勵多一張「電路擴充」
    this.credits += this.reward.bonus;
    this.state = 'reward';
    Screen.reward();
  },
  // ---------- 取得晶片：已擁有同種晶片（且未滿級）就合成升級，否則放進倉庫 ----------
  mergeTarget(id) {
    if (!canLevelUp(id)) return null;
    const b = baseOf(id);
    for (const arr of [this.chain, this.inventory])
      for (let i = 0; i < arr.length; i++)
        if (arr[i] && baseOf(arr[i]) === b && levelOf(arr[i]) < CFG.MAX_CHIP_LV) return { arr, i };
    return null;
  },
  canAcquire(id) { return !!this.mergeTarget(id) || this.inventory.includes(null); },
  acquire(id) {
    if (this.runStats) this.runStats.got.push(`${this.here()} ${CHIPS[id].name}`);
    const t = this.mergeTarget(id);
    if (t) {
      const lv = levelOf(t.arr[t.i]) + 1;
      t.arr[t.i] = leveledId(baseOf(id), lv);
      this.recalc();
      SFX.play('upgrade');
      return `「${CHIPS[baseOf(id)].name}」合成升級為 Lv${lv}`;
    }
    const i = this.inventory.indexOf(null);
    if (i < 0) return null;
    this.inventory[i] = id;
    this.recalc();
    return `獲得「${CHIPS[id].name}」，已放入倉庫`;
  },
  takeReward(id) {
    let msg;
    if (id) {
      msg = this.acquire(id);
      if (!msg) return;
    } else {
      this.credits += 10;
      msg = '跳過獎勵：◆ +10';
    }
    this.showMap(msg);
    if (id) this.openEditorWith(msg);  // 拿到晶片後直接打開電路編輯器，方便馬上裝上
  },
  openEditorWith(msg) {
    this.toggleEditor();
    if (this.state === 'editor') Editor.infoEl.innerHTML = `<b style="color:#9dff6b">${msg}</b><br>新晶片在下方倉庫：拖到上方電路（或點一下再點插槽）就能裝上。按 Tab 或「返回」回到航圖。`;
  },

  // ---------- 商店 ----------
  openShop() {
    const items = pickN(NORMAL_IDS, 4).map(id => ({ id, price: chipPrice(id), sold: false }));
    if (Math.random() < 0.6) { const id = pick(COMPOSITE_IDS); items.push({ id, price: chipPrice(id), sold: false }); }
    this.shop = { items, slotBought: false, healed: false };
    this.state = 'shop';
    Screen.shop();
  },
  shopHeal() {  // 補給站補血：每間限 1 次
    const p = this.player, R = CFG.SHOP_REPAIR;
    if (this.shop.healed || this.credits < R.price || p.hp >= p.maxHp) return;
    this.credits -= R.price; this.shop.healed = true;
    p.hp = Math.min(p.maxHp, p.hp + R.hp);
    Screen.shop(`補血完成：HP +${R.hp}`);
  },
  buy(idx) {
    const it = this.shop.items[idx];
    if (!it || it.sold || this.credits < it.price || !this.canAcquire(it.id)) return;
    this.credits -= it.price; it.sold = true;
    Screen.shop(this.acquire(it.id));
  },
  // ---------- 武器 ----------
  refreshWeapon() {  // 重新計算武器參數，並更新電路第 1 格的顯示
    const W = WEAPONS[this.weapon.id], st = this.weapon, c = CHIPS.weapon;
    this.wp = weaponParams(st);
    c.name = weaponTitle(st);
    c.short = W.short;
    const lines = [W.desc];
    if (st.path) lines.push(`第一段・${W.paths[st.path].name}：${W.paths[st.path].desc}`);
    if (st.final != null) { const n = W.paths[st.path].next[st.final]; lines.push(`第二段・${n.name}：${n.desc}`); }
    c.desc = lines.join('<br>') + '<br><span style="color:#6a79ad">武器固定在電路第 1 格，這一場不能更換。</span>';
    if (this.player) this.recalc();
  },
  weaponStage() { return this.weapon.final != null ? 2 : this.weapon.path ? 1 : 0; },
  upgradeWeapon(choice) {  // 只在軍械台升級
    const st = this.weapon;
    if (st.final != null) return;
    if (!st.path) st.path = choice; else st.final = +choice;
    this.refreshWeapon();
    if (this.runStats) this.runStats.upgrades.push(`${this.here()} ${weaponTitle(st)}`);
    SFX.play('upgrade');
    this.showMap(`武器升級：${weaponTitle(st)}`);
  },
  // 電路擴充（插槽 +1）的來源：補給站購買、精英獎勵、武器升滿後的軍械台、擊敗 Boss
  expandSlot(source) {
    if (this.chain.length >= CFG.MAX_SLOTS) return;
    if (source === 'shop') {
      if (this.credits < CFG.SHOP_SLOT || this.shop.slotBought) return;
      this.credits -= CFG.SHOP_SLOT;
      this.shop.slotBought = true;
    }
    this.chain.push(null);
    this.recalc();
    SFX.play('upgrade');
    if (this.runStats) this.runStats.got.push(`${this.here()} 插槽 +1（${{ shop: '補給站', reward: '精英獎勵', armory: '軍械台' }[source] || source}）`);
    const msg = `電路擴充：插槽 +1（目前 ${this.chain.length} 格）`;
    if (source === 'shop') Screen.shop(msg);
    else this.showMap(msg);
  },
  armoryBonus() {
    const B = CFG.ARMORY_BONUS, p = this.player;
    this.credits += B.credits;
    p.hp = Math.min(p.maxHp, p.hp + B.hp);
    this.showMap(`武器已升滿：改領 ◆ +${B.credits}、HP +${B.hp}`);
  },
  // 目前這一關的摘要（遊玩紀錄用）
  sectorSummary() {
    const R = this.runStats, S = this.sectorStats;
